<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD28E">
<title>PIP Grandma's Kitchen</title>
<meta name="description" content="PIP: a shared fluffy companion for two phones. Grandma teaches, Emma cooks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2228%22 fill=%22%23FFFDF8%22 stroke=%22%23F4E6D1%22 stroke-width=%224%22/%3E%3Cellipse cx=%2224%22 cy=%2230%22 rx=%222.4%22 ry=%224%22 fill=%22%235A3B31%22/%3E%3Cellipse cx=%2240%22 cy=%2230%22 rx=%222.4%22 ry=%224%22 fill=%22%235A3B31%22/%3E%3Cellipse cx=%2218%22 cy=%2238%22 rx=%225%22 ry=%223%22 fill=%22%23FFB3B5%22/%3E%3Cellipse cx=%2246%22 cy=%2238%22 rx=%225%22 ry=%223%22 fill=%22%23FFB3B5%22/%3E%3Cpath d=%22M27 36 Q32 35 37 36 Q36.5 43 32 43 Q27.5 43 27 36Z%22 fill=%22%236A4C42%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Honey afternoon: PIP's sketch background is the brand colour; one cozy light world */
  --honey: #FFD28E;
  --cream: #FFF7EA;
  --cocoa: #4B2E24;
  --blush: #FFB3B5;
  --sage: #A9CF9F;
  --tomato: #E9654F;
  /* derived */
  --honey-deep: #F7B65A;
  --honey-edge: #D9913A;
  --cream-2: #FCEBD2;
  --paper: #FFFDF8;
  --cocoa-2: #6E4B3B;
  --line: #EED6B3;
  --sage-ink: #3F6B3B;
  --shadow: rgba(122, 78, 40, .18);
  --font-display: "Fredoka", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", ui-rounded, system-ui, sans-serif;
  /* layout: phone-first stage (the illustrated room where PIP lives) above a soft sheet with one clear action */
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body, #root { height: 100%; margin: 0; }
body { background: var(--honey); color: var(--cocoa); font-family: var(--font-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--cocoa); outline-offset: 3px; border-radius: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- mini PIP (logo, chips, stickers) ---------- */
.mini-pip { position: relative; display: inline-block; width: 30px; height: 30px; flex: none; vertical-align: middle; }
.mini-pip .mp-body { position: absolute; inset: -6%; background-size: 100% 100%; }
.mini-pip .pip-face { position: absolute; inset: -6%; width: 112%; height: 112%; }

/* ---------- app shell ---------- */
.app { position: relative; height: 100%; width: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--honey); isolation: isolate; font-size: 16px; }
.app.mode-easy { font-size: 20px; }
.topbar { position: absolute; z-index: 30; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: calc(env(safe-area-inset-top) + 10px) 12px 8px; pointer-events: none; }
.topbar .tb-row2 { flex-basis: 100%; display: flex; align-items: center; gap: 6px; }
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 6px; min-width: 0; }
.brand .mini-pip { width: 32px; height: 32px; }
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .12em; color: var(--cocoa); }
.sync-pill { display: inline-flex; align-items: center; gap: 5px; font: 700 10.5px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: rgba(255, 253, 248, .9); color: var(--cocoa-2); white-space: nowrap; }
.sync-pill i { width: 7px; height: 7px; border-radius: 50%; background: #B9A089; }
.sync-pill.st-live i { background: #3E9B4F; box-shadow: 0 0 0 3px rgba(62, 155, 79, .2); animation: pulse 2s infinite; }
.sync-pill.st-connecting i { background: #E3A43A; animation: pulse 1s infinite; }
.sync-pill.st-view i { background: #C7643F; }
.partner { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: rgba(255, 253, 248, .92); box-shadow: 0 2px 0 var(--shadow); font-weight: 700; font-size: 13px; white-space: nowrap; }
.mode-easy .partner { font-size: 15px; }
.partner .pdot { width: 8px; height: 8px; border-radius: 50%; background: #C9B39C; }
.partner .pdot.on { background: #3E9B4F; }
.partner .pst { color: var(--cocoa-2); font-weight: 600; }
.av { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font: 700 13px/1 var(--font-display); color: var(--cocoa); flex: none; }
.av-grandma { background: var(--sage); }
.av-emma { background: var(--blush); }
.av.big { width: 46px; height: 46px; font-size: 22px; }
.tb-actions { display: flex; gap: 6px; margin-left: auto; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255, 253, 248, .92); box-shadow: 0 2px 0 var(--shadow); display: grid; place-items: center; color: var(--cocoa); padding: 0; }
.mode-easy .iconbtn { width: 50px; height: 50px; }
.iconbtn svg { width: 22px; height: 22px; fill: currentColor; }
.iconbtn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--shadow); }
.banner { position: absolute; z-index: 29; top: calc(env(safe-area-inset-top) + 104px); left: 12px; right: 12px; background: #FFF3D6; border: 2px solid var(--honey-edge); color: var(--cocoa); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 13px; }
.toasts { position: absolute; z-index: 40; top: calc(env(safe-area-inset-top) + 100px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; background: var(--paper); color: var(--cocoa); border-radius: 999px; padding: 8px 14px 8px 8px; box-shadow: 0 6px 20px var(--shadow), 0 2px 0 var(--shadow); font-weight: 700; font-size: 14px; max-width: 90%; animation: toast-in .35s cubic-bezier(.2, 1.4, .4, 1) both; }
.mode-easy .toast { font-size: 18px; }
.toast .ing.ti, .toast .mini-pip.ti { width: 30px; height: 30px; }
.toast.out { animation: toast-out .4s ease both; }

/* ---------- stage & world ---------- */
.stage { position: relative; flex: 1 1 auto; min-height: 150px; overflow: hidden; background-color: #FFF0DA; background-image: radial-gradient(#F7DDB8 2.2px, transparent 2.6px), radial-gradient(#F7DDB8 2.2px, transparent 2.6px); background-size: 26px 26px; background-position: 6px 6px, 19px 19px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.world { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); aspect-ratio: 390 / 420; width: 100%; }
.scene-wrap, .scene-wrap .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene-wrap .scene.fade-in { animation: fade-in .45s ease both; }
.cook-cv, .fx-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.cook-cv { z-index: 3; }
.fx-cv { z-index: 8; }
.cook-cv[hidden] { display: none; }
/* touch area over the wok: drop target and stirring circle (world units: x 180-360, y 150-310) */
.wok-hit { position: absolute; z-index: 4; left: 46.15%; width: 46.15%; top: 35.7%; height: 38.1%; touch-action: none; }
.wok-hit .drop-ring { position: absolute; left: 3.3%; width: 88.9%; top: 48%; height: 28%; border-radius: 50%; border: 3px dashed transparent; pointer-events: none; transition: border-color .2s, background .2s; }
.wok-hit.target .drop-ring { border-color: rgba(75, 46, 36, .45); }
.wok-hit.over .drop-ring { border-color: var(--tomato); background: rgba(255, 210, 142, .3); }
.wok-hit.stirring { cursor: grab; }
.wok-hit.stirring:active { cursor: grabbing; }
.wok-hit .stir-guide { position: absolute; left: 47.8%; top: 64%; width: 94%; height: 32%; transform: translate(-50%, -50%); overflow: visible; pointer-events: none; opacity: 0; transition: opacity .3s; }
.wok-hit.stirring .stir-guide { opacity: 1; }
.stir-guide ellipse { fill: none; stroke: rgba(75, 46, 36, .42); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 7 9; vector-effect: non-scaling-stroke; animation: dash-run 1.1s linear infinite; }

/* ---------- PIP ---------- */
.pip-actor { position: absolute; z-index: 6; left: calc(var(--x, 44%) - var(--w, 30%) / 2); bottom: var(--y, 14%); width: var(--w, 30%); aspect-ratio: 1; transition: left .7s cubic-bezier(.4, 0, .2, 1), bottom .7s cubic-bezier(.4, 0, .2, 1); }
.pip-mover { position: absolute; inset: 0; transform-origin: 50% 95%; will-change: transform; }
.pip { position: absolute; inset: 0; transform-origin: 50% 92%; animation: breathe 2.8s ease-in-out infinite; }
.pip::before { content: ""; position: absolute; left: 22%; right: 22%; bottom: -1%; height: 9%; border-radius: 50%; background: rgba(110, 70, 40, .2); filter: blur(1.5px); }
.pip-feet, .pip-face { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pip-body { position: absolute; inset: 0; background-size: 100% 100%; }
.pip-face-wrap { position: absolute; inset: 0; }
.pip .pip-eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.pip-mover.wiggle { animation: wiggle .9s ease; }
.pip-mover.shake { animation: shake .6s ease 2; }
.pip-mover.chewing .pip { animation: chew .32s ease-in-out infinite; }
.carry { position: absolute; left: 50%; top: -34%; width: 50%; aspect-ratio: 1; transform: translateX(-50%); z-index: 2; touch-action: none; }
.carry:empty { pointer-events: none; }
.carry .ing { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 0 rgba(91, 58, 46, .18)); animation: bob 1.6s ease-in-out infinite; }
.carry.grab { cursor: grab; }
.carry.grab::after { content: ""; position: absolute; inset: -12%; border-radius: 50%; border: 3px dashed rgba(75, 46, 36, .45); animation: spin-plain 8s linear infinite; }
.carry .spark { position: absolute; right: -10%; top: -6%; width: 34%; aspect-ratio: 1; background: radial-gradient(circle, #fff 0 20%, transparent 22%), conic-gradient(from 0deg, transparent 0 40deg, #FFE7A8 40deg 50deg, transparent 50deg 130deg, #FFE7A8 130deg 140deg, transparent 140deg 220deg, #FFE7A8 220deg 230deg, transparent 230deg 310deg, #FFE7A8 310deg 320deg, transparent 320deg); border-radius: 50%; animation: twinkle 1.2s ease-in-out infinite; }
.bubble { position: absolute; left: 50%; bottom: 104%; transform: translateX(calc(-30% + var(--bx, 0px))); width: max-content; max-width: min(250px, 72vw); background: var(--paper); border-radius: 18px; padding: 9px 13px; box-shadow: 0 3px 0 var(--shadow), 0 8px 20px rgba(122, 78, 40, .12); font-weight: 700; font-size: 15px; line-height: 1.3; z-index: 7; }
.mode-easy .bubble { font-size: 19px; max-width: min(300px, 80vw); padding: 11px 15px; }
.bubble::after { content: ""; position: absolute; left: calc(26% - var(--bx, 0px)); bottom: -9px; width: 18px; height: 18px; background: var(--paper); transform: rotate(45deg); border-radius: 3px; box-shadow: 3px 3px 0 var(--shadow); }
.bubble p { margin: 0; position: relative; z-index: 1; }
.bubble p.b2 { margin-top: 4px; font-size: .86em; color: var(--cocoa-2); }
.bubble .speak { position: relative; z-index: 1; margin-top: 6px; border: 0; background: var(--cream-2); border-radius: 999px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
.bubble .speak svg { width: 22px; height: 22px; fill: var(--cocoa); }
.bubble.pop { animation: bubble-in .4s cubic-bezier(.2, 1.4, .4, 1) both; }
.pip-actor.has-carry .bubble { bottom: 146%; }

.away { position: absolute; z-index: 5; bottom: 16%; display: flex; align-items: center; gap: 8px; }
[data-role="grandma"] .away { right: 4%; flex-direction: row; }
[data-role="emma"] .away { left: 4%; flex-direction: row-reverse; }
.away-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 253, 248, .94); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 700; font-size: 13px; box-shadow: 0 2px 0 var(--shadow); }
.mode-easy .away-chip { font-size: 16px; }
.away .steps { display: flex; gap: 7px; }
.away .steps i { width: 10px; height: 7px; border-radius: 50%; background: rgba(110, 70, 40, .25); animation: steps 1.8s infinite; }
.away .steps i:nth-child(2) { animation-delay: .3s; } .away .steps i:nth-child(3) { animation-delay: .6s; }

/* porthole: live window into the other kitchen */
.porthole { position: absolute; z-index: 8; right: 14px; top: calc(env(safe-area-inset-top) + 104px); display: flex; flex-direction: column; align-items: center; gap: 4px; animation: pop-in .4s cubic-bezier(.2, 1.4, .4, 1) both; }
[data-role="emma"] .porthole { left: 14px; right: auto; }
.porthole.center { left: 50%; right: auto; transform: translateX(-50%); animation: none; }
.port-ring { width: 118px; aspect-ratio: 1; border-radius: 50%; padding: 6px; background: conic-gradient(var(--tomato) var(--deg, 0deg), rgba(255, 253, 248, .9) 0); box-shadow: 0 3px 0 var(--shadow), 0 10px 22px rgba(122, 78, 40, .16); }
.mode-easy .port-ring { width: 140px; }
.port-ring.calm { background: rgba(255, 253, 248, .92); }
.port-in { width: 100%; height: 100%; border-radius: 50%; background: #FFF0DA; display: grid; place-items: center; overflow: hidden; border: 3px solid var(--paper); position: relative; }
.port-in.w { background: #FFF0DA; display: block; }
.port-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.port-in .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.port-in .flash.go { animation: flash .5s ease-out; }
.port-in.g { background: linear-gradient(#FDEBC8, #FFE0B0); }
.port-in .port-pip { width: 62%; height: 62%; }
.port-in .av.big { position: absolute; right: 8%; bottom: 8%; width: 36%; height: 36%; font-size: 17px; border: 3px solid var(--paper); }
.port-lbl { background: var(--paper); border-radius: 999px; padding: 4px 10px; font-weight: 800; font-size: 12.5px; box-shadow: 0 2px 0 var(--shadow); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.mode-easy .port-lbl { font-size: 15px; }
.port-lbl .mini-pip { width: 22px; height: 22px; margin: -3px 0 -3px -4px; }
.photo { position: absolute; z-index: 12; inset: 0; display: grid; place-items: center; pointer-events: none; }
.polaroid { width: 64%; max-width: 250px; background: var(--paper); padding: 10px 10px 14px; border-radius: 8px; box-shadow: 0 10px 30px rgba(122, 78, 40, .3); transform: rotate(-4deg); position: relative; text-align: center; font-weight: 800; }
.polaroid .dish-art { width: 100%; background: #FFF0DA; border-radius: 4px; display: block; }
.polaroid .pip.ph-pip { position: absolute; width: 38%; aspect-ratio: 1; inset: auto; right: -6%; top: 26%; animation: none; }
.polaroid p { margin: 8px 0 0; font-size: 16px; }
.photo.in .polaroid { animation: photo-in .7s cubic-bezier(.2, 1.3, .4, 1) both; }

/* ---------- sheet & panels ---------- */
.sheet { position: relative; z-index: 10; flex: none; margin-top: -26px; background: var(--cream); border-radius: 28px 28px 0 0; box-shadow: 0 -6px 26px rgba(122, 78, 40, .16); padding: 16px 18px calc(env(safe-area-inset-bottom) + 18px); max-height: 66%; overflow-y: auto; }
.mode-easy .sheet { max-height: 72%; padding: 18px 18px calc(env(safe-area-inset-bottom) + 20px); }
.panel { display: flex; flex-direction: column; gap: 12px; }
.panel.enter > * { animation: rise .38s cubic-bezier(.2, .9, .3, 1) both; }
.panel.enter > *:nth-child(2) { animation-delay: .04s; } .panel.enter > *:nth-child(3) { animation-delay: .08s; } .panel.enter > *:nth-child(4) { animation-delay: .12s; }
.ptitle { font-family: var(--font-display); font-weight: 600; font-size: 23px; line-height: 1.15; margin: 0; letter-spacing: .005em; display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
.mode-easy .ptitle { font-size: 30px; }
.ptitle:focus { outline: none; }
.ptitle:focus-visible { outline: 3px solid var(--cocoa); }
.psub { margin: -4px 0 0; color: var(--cocoa-2); font-weight: 600; line-height: 1.4; }
.eyebrow { margin: 0 0 -6px; font: 800 12px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--cocoa-2); }
.mode-easy .eyebrow { font-size: 14px; }
.dots { display: inline-flex; gap: 4px; margin-left: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .3; animation: dot 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
.hint { margin: 0; color: var(--cocoa-2); font-size: .85em; font-weight: 600; text-align: center; min-height: 1em; }

/* buttons: soft "pillow" buttons with a pressed state */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 10px 18px; border-radius: 18px; border: 0; font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.15; background: var(--paper); color: var(--cocoa); box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s, background .2s; text-align: center; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--honey-deep); box-shadow: 0 5px 0 var(--honey-edge); }
.btn.primary:active:not(:disabled) { box-shadow: 0 2px 0 var(--honey-edge); }
.btn.soft { background: var(--cream-2); box-shadow: 0 4px 0 var(--line); }
.btn.ghost { background: transparent; box-shadow: none; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; text-decoration-color: rgba(75, 46, 36, .35); min-height: 44px; }
.btn.ghost.sm { min-height: 40px; padding: 6px 10px; font-size: 15px; }
.btn.danger { color: #9A3A22; }
.btn.big { min-height: 60px; font-size: 20px; border-radius: 22px; }
.mode-easy .btn { min-height: 60px; font-size: 21px; }
.mode-easy .btn.big { min-height: 76px; font-size: 25px; border-radius: 24px; }
.btn:disabled { opacity: .55; box-shadow: 0 2px 0 var(--line); }
.btn .bi, .btn .ing.bi { width: 34px; height: 34px; flex: none; }
.mode-easy .btn .bi { width: 42px; height: 42px; }
.btn .dish-art.bi { width: 54px; height: auto; }
.btn .emo { font-size: 1.15em; line-height: 1; }
.btn.serve.ready { animation: ready-glow 1.6s ease-in-out infinite; }
.btn.chip { min-height: 56px; border-radius: 999px; font-size: 21px; padding: 10px 18px; background: var(--paper); }
.col-actions { display: flex; flex-direction: column; gap: 12px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.row-actions .btn { flex: 1 1 auto; }
.mode-easy .row-actions .btn.ghost { flex: 0 1 auto; padding: 8px 10px; font-size: 19px; }

/* choice tiles */
.tiles { display: grid; gap: 12px; }
.tiles.two { grid-template-columns: 1fr 1fr; }
.tiles.three { grid-template-columns: repeat(3, 1fr); }
.tiles.four { grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 6px 10px; min-height: 112px; border: 0; border-radius: 22px; background: var(--paper); box-shadow: 0 5px 0 var(--line), inset 0 0 0 2px #F6E4C8; transition: transform .08s, box-shadow .08s; }
.tile:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line), inset 0 0 0 2px #F6E4C8; }
.tile .ing { width: 64px; height: 64px; }
.tile .tl { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.1; text-align: center; }
.tile .ts { font-size: 12px; font-weight: 700; color: var(--cocoa-2); }
.tiles.four .tile { min-height: 92px; padding: 8px 4px; border-radius: 18px; }
.tiles.four .tile .ing { width: 46px; height: 46px; }
.tiles.four .tile .tl { font-size: 14px; }
.mode-easy .tile { min-height: 150px; }
.mode-easy .tile .ing { width: 82px; height: 82px; }
.mode-easy .tile .tl { font-size: 24px; }
.mode-easy .tile .ts { font-size: 14px; }
.mode-easy .tiles.three .tile .ing { width: 70px; height: 70px; }
.mode-easy .tiles.three .tile .tl { font-size: 21px; }
.mode-easy .tiles.four { grid-template-columns: 1fr 1fr; }

.dish-list { display: flex; flex-direction: column; gap: 10px; }
.dish-card { display: flex; align-items: center; gap: 14px; text-align: left; border: 0; border-radius: 22px; padding: 8px 16px 8px 8px; background: var(--paper); box-shadow: 0 5px 0 var(--line), inset 0 0 0 2px #F6E4C8; min-height: 84px; }
.dish-card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.dish-card .dish-art { width: 104px; flex: none; }
.dish-card b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 24px; }
.dish-card small { display: block; font-weight: 700; color: var(--cocoa-2); font-size: 14px; }
.mode-standard .dish-card b { font-size: 19px; }

.steps-row .who-grandma.now .node { background: var(--sage); box-shadow: 0 0 0 4px rgba(169, 207, 159, .45); color: var(--cocoa); }
.steps-row .who-emma.now .node { background: var(--blush); box-shadow: 0 0 0 4px rgba(255, 179, 181, .45); color: var(--cocoa); }
.steps-row .now .node { animation: pulse-node 1.6s ease-in-out infinite; }
.steps-row .now { color: var(--cocoa); }
.steps-row .done .node { background: var(--cocoa); color: var(--paper); box-shadow: none; }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; z-index: 50; background: rgba(75, 46, 36, .32); display: flex; align-items: flex-end; justify-content: center; padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px); }
.overlay.enter { animation: fade-in .25s ease both; }
.ov-card, .ov-invite { background: rgba(75, 46, 36, .4); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.overlay.enter .modal { animation: sheet-up .5s cubic-bezier(.2, 1.1, .3, 1) both; }
.modal { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet-modal { background: var(--cream); border-radius: 26px; padding: 16px 18px 20px; box-shadow: 0 -6px 30px rgba(75, 46, 36, .25); }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mhead h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 24px; }
.mhead h2:focus { outline: none; }
.kactions { background: var(--cream); border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -4px 24px rgba(75, 46, 36, .2); }
.ov-card { align-items: center; }

/* keepsake card */
.kcard { position: relative; background: var(--paper); border-radius: 22px; padding: 14px 14px 16px; box-shadow: 0 12px 36px rgba(75, 46, 36, .28); background-image: linear-gradient(transparent 0 0); }
.kcard::before { content: ""; position: absolute; inset: 6px; border-radius: 17px; border: 2px dashed #F2DDBE; pointer-events: none; }
.kphoto { position: relative; background: linear-gradient(#FFF0DA, #FFE6C2); border-radius: 14px; padding: 8px 10px 4px; transform: rotate(-1.4deg); }
.kphoto .dish-art { width: 58%; display: block; margin: 0 auto; }
.kphoto .pip.sticker { position: absolute; inset: auto; right: 2%; bottom: 4%; width: 30%; aspect-ratio: 1; animation: none; transform: rotate(6deg); }
.kphoto .tape { position: absolute; top: -9px; width: 64px; height: 20px; background: rgba(255, 210, 142, .8); border-radius: 3px; }
.kphoto .tape.l { left: 12px; transform: rotate(-8deg); } .kphoto .tape.r { right: 12px; transform: rotate(7deg); background: rgba(255, 179, 181, .8); }
.kphoto .stamp { position: absolute; left: 6%; top: 14%; transform: rotate(-10deg); border: 3px solid #C74A33; color: #A8381F; border-radius: 10px; padding: 3px 8px; font: 700 13px/1.15 var(--font-display); background: rgba(255, 253, 248, .85); max-width: 46%; }
.kbody { padding: 10px 6px 0; position: relative; }
.kbody h2 { margin: 2px 0 2px; font-family: var(--font-display); font-weight: 600; font-size: 25px; line-height: 1.1; }
.kbody h2:focus { outline: none; }
.mode-easy .kbody h2 { font-size: 29px; }
.kmeta { margin: 0 0 8px; color: var(--cocoa-2); font-weight: 700; font-size: 13px; }
.mode-easy .kmeta { font-size: 16px; }
.kcontrib { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.kcontrib li { display: flex; gap: 10px; align-items: flex-start; background: var(--cream); border-radius: 14px; padding: 7px 10px; }
.kcontrib li div { display: flex; flex-direction: column; font-weight: 700; font-size: 14px; line-height: 1.35; }

.kpip { display: flex; gap: 8px; align-items: center; margin: 10px 0 0; font-weight: 700; font-size: 14.5px; line-height: 1.35; }

/* settings */
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; }
.seg { display: inline-flex; background: var(--cream-2); border-radius: 14px; padding: 4px; gap: 4px; }

.menu-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }

.about[lang="zh-CN"] { border-top: 2px dashed var(--line); margin-top: 10px; padding-top: 4px; }

/* fliers (drag ghost, falling ingredients) */
.panel.busy .btn, .panel.busy .tile { opacity: .55; transition: opacity .2s; }
.flyer { position: fixed; z-index: 9999; pointer-events: none; display: block; }
.flyer svg, .flyer .ing { width: 100%; height: 100%; display: block; }
.flyer.drag { filter: drop-shadow(0 10px 8px rgba(75, 46, 36, .25)); }

/* ---------- role picker & side-by-side view ---------- */
.picker { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px 20px calc(env(safe-area-inset-bottom) + 24px); text-align: center; }
.picker .hero-pip { position: relative; width: 150px; height: 150px; }
.picker .hero-pip .pip { animation: breathe 2.8s ease-in-out infinite; }
.picker h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 46px; letter-spacing: .14em; }
.picker .tag { margin: -8px 0 4px; font-weight: 800; color: var(--cocoa-2); }
.picker h2 { margin: 8px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 24px; }
.picker p.sub { margin: 0; max-width: 32ch; font-weight: 700; color: var(--cocoa-2); }
.role-cards { display: grid; gap: 12px; width: 100%; max-width: 380px; }
.role-card { display: flex; align-items: center; gap: 14px; text-align: left; border: 0; border-radius: 22px; padding: 14px 16px; background: var(--paper); box-shadow: 0 5px 0 var(--honey-edge); min-height: 82px; }

.role-card span.s { font-weight: 700; color: var(--cocoa-2); }
.link-btn { border: 0; background: none; font-weight: 800; text-decoration: underline; text-underline-offset: 4px; padding: 10px; min-height: 44px; }

.split { height: 100%; display: flex; flex-direction: column; align-items: center; background: radial-gradient(120% 80% at 50% 0%, #FFE2B0 0%, var(--honey) 60%); overflow: hidden; }
.split-head { display: flex; align-items: center; gap: 14px; padding: 14px 20px 10px; flex-wrap: wrap; justify-content: center; flex: none; }
.split-head h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 26px; letter-spacing: .1em; display: flex; align-items: center; gap: 8px; }
.split-head h1 .mini-pip { width: 38px; height: 38px; }
.split-head p { margin: 0; font-weight: 800; color: var(--cocoa-2); }
.split-head .btn { min-height: 40px; font-size: 14px; padding: 6px 14px; }
.phones { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: var(--gap, 46px); }
.phone-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.phone-cap { font-weight: 800; display: flex; align-items: center; gap: 8px; background: rgba(255, 253, 248, .75); border-radius: 999px; padding: 4px 12px 4px 4px; }
.phone-holder { width: calc(390px * var(--s, 1)); height: calc(812px * var(--s, 1)); position: relative; }
.phone { position: absolute; left: 0; top: 0; width: 390px; height: 812px; transform: scale(var(--s, 1)); transform-origin: 0 0; border-radius: 52px; background: #3A2A22; padding: 11px; box-shadow: 0 30px 60px rgba(75, 46, 36, .32), inset 0 0 0 2px #5A4236; }
.phone-screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--honey); transform: translateZ(0); }
.phone-screen .app { height: 100%; }
.split-foot { padding: 6px 16px 12px; font-weight: 700; color: var(--cocoa-2); font-size: 13px; text-align: center; max-width: 900px; }

/* ---------- motion ---------- */
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, .97); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.12); } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6%) rotate(3deg); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-9deg) translateY(-4%); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg) translateY(-3%); } 80% { transform: rotate(4deg); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5%) rotate(-4deg); } 40% { transform: translateX(5%) rotate(4deg); } 60% { transform: translateX(-4%); } 80% { transform: translateX(3%); } }
@keyframes chew { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.06, .93); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes pulse-node { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@keyframes dot { 0%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
@keyframes steps { 0%, 100% { opacity: .15; } 40% { opacity: .6; } }
@keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }
@keyframes spin-plain { to { transform: rotate(360deg); } }
@keyframes flicker { 0% { transform: scaleY(1); } 100% { transform: scaleY(.9) translateY(2px); } }
@keyframes flash { 0% { opacity: 0; } 12% { opacity: .95; } 100% { opacity: 0; } }
@keyframes dash-run { to { stroke-dashoffset: -32; } }
@keyframes steam { 0% { opacity: 0; transform: translateY(18px); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-26px); } }
@keyframes bump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(5%) scaleX(1.03); } }
@keyframes plate-in { from { opacity: 0; transform: translateY(40%) scale(.7); } to { opacity: 1; transform: none; } }
@keyframes photo-in { 0% { opacity: 0; transform: translateX(80%) rotate(18deg) scale(.6); } 100% { opacity: 1; transform: rotate(-4deg); } }
@keyframes bubble-in { 0% { opacity: 0; transform: translateX(calc(-30% + var(--bx, 0px))) translateY(10px) scale(.8); } 100% { opacity: 1; transform: translateX(calc(-30% + var(--bx, 0px))) translateY(0) scale(1); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(-14px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-10px); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet-up { from { opacity: 0; transform: translateY(60px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pop-in { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@keyframes twinkle { 0%, 100% { transform: scale(.8) rotate(0); opacity: .7; } 50% { transform: scale(1.1) rotate(30deg); opacity: 1; } }
@keyframes ready-glow { 0%, 100% { box-shadow: 0 5px 0 var(--honey-edge), 0 0 0 0 rgba(233, 101, 79, .0); } 50% { box-shadow: 0 5px 0 var(--honey-edge), 0 0 0 8px rgba(233, 101, 79, .22); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- web build: kitchen code page ---------- */
.picker.room { justify-content: flex-start; padding-top: 22px; gap: 10px; }
.room-top { display: flex; align-items: center; gap: 8px; font: 600 22px/1 var(--font-display); letter-spacing: .1em; }
.room-top .mini-pip { width: 34px; height: 34px; }
.room-code { margin-left: 8px; font: 800 13px/1 var(--font-body); letter-spacing: .04em; background: var(--paper); border-radius: 999px; padding: 6px 10px; }
.room-code code, .stv code { font: 800 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
.room-cards { display: grid; gap: 14px; width: 100%; max-width: 760px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.room-card { background: var(--paper); border-radius: 24px; padding: 14px; box-shadow: 0 5px 0 var(--honey-edge); display: flex; flex-direction: column; gap: 10px; align-items: stretch; text-align: left; }

.rc-qr { align-self: center; width: 172px; height: 172px; background: #fff; border-radius: 14px; padding: 6px; box-shadow: inset 0 0 0 2px var(--line); }

.rc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

<div id="root"></div>
<script src="vendor/mqtt.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
"use strict";
const PIP_BUILD = "web";
/* ---- art.js ---- */
/* ============================================================
   PIP art: fluffy body (canvas), faces, ingredients, dishes, scenes
   All original drawings. Style: cozy storybook, rounded shapes,
   warm cocoa outlines, honey + cream + blush palette.
   ============================================================ */
const INK = '#5B3A2E';
const O = `stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;

function seeded(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}

/* ---------- PIP body: hand-made fluff on canvas (cached data URL) ---------- */
const Art = {};
Art._fluff = null;
Art.fluff = function () {
  if (Art._fluff) return Art._fluff;
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  if (!x) return '';
  const cx = S / 2, cy = S / 2 + 6, R = 192;
  const rnd = seeded(20261107);
  // soft core
  const g = x.createRadialGradient(cx - 46, cy - 64, 16, cx, cy, R + 8);
  g.addColorStop(0, '#FFFFFF');
  g.addColorStop(0.5, '#FFFAF3');
  g.addColorStop(0.86, '#FCF2E4');
  g.addColorStop(1, '#F4E6D1');
  x.fillStyle = g;
  x.beginPath(); x.arc(cx, cy, R - 6, 0, Math.PI * 2); x.fill();
  x.lineCap = 'round';
  // fibers around the rim: the crayon-fluff edge from the team's sketch
  for (let i = 0; i < 5600; i++) {
    const a = rnd() * Math.PI * 2;
    const r0 = R - 26 + rnd() * 26;
    const len = rnd() < 0.12 ? 12 + rnd() * 12 : 5 + rnd() * 12;
    const bend = (rnd() - 0.5) * 0.18;
    const x0 = cx + Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0;
    const x1 = cx + Math.cos(a + bend) * (r0 + len), y1 = cy + Math.sin(a + bend) * (r0 + len);
    const k = rnd();
    x.strokeStyle = k < 0.58 ? `rgba(255,255,255,${0.55 + rnd() * 0.45})`
      : k < 0.9 ? `rgba(252,243,230,${0.5 + rnd() * 0.4})`
      : `rgba(238,218,192,${0.28 + rnd() * 0.32})`;
    x.lineWidth = 0.9 + rnd() * 1.9;
    x.beginPath(); x.moveTo(x0, y0);
    x.quadraticCurveTo((x0 + x1) / 2 + (rnd() - 0.5) * 7, (y0 + y1) / 2 + (rnd() - 0.5) * 7, x1, y1);
    x.stroke();
  }
  // a little cowlick tuft on top (new: gives PIP a readable silhouette when tiny)
  for (let i = 0; i < 90; i++) {
    const a = -Math.PI / 2 + (rnd() - 0.45) * 0.42;
    const r0 = R - 18 + rnd() * 12;
    const len = 26 + rnd() * 26;
    const x0 = cx + Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0;
    const x1 = cx + Math.cos(a) * (r0 + len) + 10 + rnd() * 14, y1 = cy + Math.sin(a) * (r0 + len) + 6;
    x.strokeStyle = i % 3 ? `rgba(255,255,255,${0.7 + rnd() * 0.3})` : `rgba(240,222,198,${0.6 + rnd() * 0.3})`;
    x.lineWidth = 1.4 + rnd() * 2.2;
    x.beginPath(); x.moveTo(x0, y0);
    x.quadraticCurveTo(x0 + (rnd() - 0.3) * 10, y0 - len * 0.9, x1, y1);
    x.stroke();
  }

/* ============================================================
   Shared state + sync.
   Each phone writes ONLY its own role document (single writer,
   no conflicts). Both phones read both documents and derive the
   same cooking phase from them.
     cloud: Claude artifact `db` (persistent, realtime) + `room`
            (instant moments, presence for live stirring)
     local: one screen / same device (in-memory + BroadcastChannel)
   ============================================================ */
const sleep = ms => new Promise(r => setTimeout(r, ms));

const ROLES = ['grandma', 'emma'];
const otherRole = r => (r === 'grandma' ? 'emma' : 'grandma');

  return Promise.race([Promise.resolve(p).catch(() => fallback), sleep(ms).then(() => fallback)]);
}

class BaseHub {
  constructor() { this.subs = new Set(); this.docs = { grandma: null, emma: null }; this.moments = []; this._q = false; }
  subscribe(fn) { this.subs.add(fn); return () => this.subs.delete(fn); }
  notify() {
    if (this._q) return; this._q = true;
    queueMicrotask(() => { this._q = false; this.subs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); });
  }
  accept(role, doc) {
    if (!ROLES.includes(role) || !validDoc(doc)) return false;
    const cur = this.docs[role];
    if (cur && (cur.v || 0) >= doc.v) return false;
    this.docs[role] = doc; this.notify(); return true;
  }
  sortMoments() { this.moments.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); }
}

/* ---------- Local hub: both phones on one screen, or two tabs on one device ---------- */
class LocalHub extends BaseHub {
  constructor(ns, opts = {}) {
    super();
    this.kind = 'local'; this.mode = opts.mode || 'same-screen'; this.ready = true; this.status = this.mode === 'same-screen' ? 'local' : 'tabs';
    this.key = 'pip-local-v1-' + ns;
    const saved = lsGet(this.key, null);
    if (saved && saved.docs) { this.docs = { grandma: saved.docs.grandma || null, emma: saved.docs.emma || null }; this.moments = saved.moments || []; }
    this.pres = {}; this.hosted = new Set(); this.remoteBeat = {}; this.self = uid('t');
    try { this.bc = new BroadcastChannel(this.key); this.bc.onmessage = e => this.onMsg(e.data); } catch (e) { this.bc = null; }
    this.beatTimer = setInterval(() => this.beat(), 2000);
  }
  host(role) { this.hosted.add(role); this.beat(); this.notify(); }
  post(m) { if (this.bc) try { this.bc.postMessage(Object.assign({ from: this.self }, m)); } catch (e) { } }
  persist() { lsSet(this.key, { docs: this.docs, moments: this.moments.slice(0, 40) }); }
  beat() { this.post({ type: 'beat', roles: [...this.hosted], pres: this.pres }); }
  onMsg(m) {
    if (!m || m.from === this.self) return;
    if (m.type === 'doc') { if (this.accept(m.role, m.doc)) this.persist(); }
    else if (m.type === 'beat') {
      (m.roles || []).forEach(r => { this.remoteBeat[r] = Date.now(); });
      if (m.pres) for (const r of ROLES) if (m.pres[r] && !this.hosted.has(r)) this.pres[r] = m.pres[r];
      this.notify();
    } else if (m.type === 'pres') { if (!this.hosted.has(m.role)) { this.pres[m.role] = m.p; this.notify(); } }
    else if (m.type === 'moment') { this.upsertMoment(m.data, false); }
    else if (m.type === 'clear') { this.moments = []; this.persist(); this.notify(); }
    else if (m.type === 'hello') { this.beat(); for (const r of this.hosted) if (this.docs[r]) this.post({ type: 'doc', role: r, doc: this.docs[r] }); }
  }
  write(role, doc) { this.docs[role] = doc; this.persist(); this.post({ type: 'doc', role, doc }); this.notify(); }
  setPresence(role, p) { this.pres[role] = Object.assign({}, this.pres[role], p, { role }); this.post({ type: 'pres', role, p: this.pres[role] }); this.notify(); }
  peerPresence(role) { return this.pres[role] || null; }
  online(role) { return this.hosted.has(role) || (Date.now() - (this.remoteBeat[role] || 0) < 6000); }
  dupRole() { return false; }
  upsertMoment(data, broadcast = true) {
    if (!data || !data.id) return;
    const i = this.moments.findIndex(m => m.id === data.id);
    if (i >= 0) this.moments[i] = data; else this.moments.push(data);
    this.sortMoments(); this.persist(); if (broadcast) this.post({ type: 'moment', data }); this.notify();
  }
  saveMoment(id, data) { this.upsertMoment(Object.assign({}, data, { id })); }
  clearMoments() { this.moments = []; this.persist(); this.post({ type: 'clear' }); this.notify(); }
  start() { this.post({ type: 'hello' }); return Promise.resolve(true); }
}

/* ---------- Cloud hub: Claude artifact db + room ---------- */
class CloudHub extends BaseHub {
  constructor(ns) {
    super();
    this.kind = 'cloud'; this.ns = ns; this.base = 'pip/' + ns; this.status = 'connecting'; this.ready = false;
    this.loaded = { grandma: false, emma: false }; this.writing = {}; this.dirty = {}; this.peers = []; this.myRole = null;
    this.canWrite = true; this.momentWrites = {};
  }
  async start() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return false;
    const [db, room, user] = await Promise.all([
      withTimeout(c.use('db'), 11000, null), withTimeout(c.use('room'), 11000, null), withTimeout(c.use('user'), 11000, null)
    ]);
    this.db = db; this.room = room; this.user = user;
    if (!db && !room) { this.status = 'offline'; this.notify(); return false; }
    if (user && typeof user.can === 'function') {
      try { const can = await withTimeout(user.can('data.write'), 4000, null); if (can === false) this.canWrite = false; } catch (e) { }
    }
    if (db) this.subscribeDb(); else { this.loaded = { grandma: true, emma: true }; }
    if (room) await this.joinRoom();
    // never block the demo for long: after 4 s go ahead with what we have
    setTimeout(() => { if (!this.ready) { this.ready = true; this.notify(); } }, 4000);
    this.status = this.canWrite ? 'live' : 'view';
    this.checkReady(); this.notify();
    return true;
  }
  subscribeDb() {
    for (const r of ROLES) {
      try {
        this.db.doc(`${this.base}/roles/${r}`).onSnapshot(snap => {
          const d = snap.exists ? snap.data() : null;
          if (d) this.accept(r, clone(d));
          if (!snap.metadata || !snap.metadata.fromCache) { this.loaded[r] = true; this.checkReady(); }
        }, err => { this.loaded[r] = true; this.checkReady(); if (err && err.code === 'revoked') { this.status = 'offline'; this.notify(); } });
      } catch (e) { this.loaded[r] = true; }
    }
    try {
      this.db.collection(`${this.base}/moments`).orderBy('createdAt', 'desc').limit(40).onSnapshot(qs => {
        this.moments = qs.docs.map(d => Object.assign({}, clone(d.data()), { id: d.id }));
        this.notify();
      }, () => { });
    } catch (e) { }
  }
  checkReady() { if (!this.ready && this.loaded.grandma && this.loaded.emma) { this.ready = true; this.notify(); } }
  async joinRoom() {
    let ch = null;
    try { ch = await withTimeout(this.room.join('pip-' + this.ns), 6000, null); } catch (e) { ch = null; }
    this.chan = ch || this.room;
    const onErr = () => { };
    this.chan.on('doc', msg => {
      if (!msg || msg.sameTab || !msg.data) return;
      const { role, doc } = msg.data;
      this.accept(role, doc);
    }, onErr);
    this.chan.on('moment', msg => {
      if (!msg || msg.sameTab || !msg.data || !msg.data.id) return;
      const i = this.moments.findIndex(m => m.id === msg.data.id);
      if (i >= 0) this.moments[i] = msg.data; else this.moments.push(msg.data);
      this.sortMoments(); this.notify();
    }, onErr);
    this.chan.onPeers(ch => {
      this.peers = (ch && ch.peers) ? ch.peers.slice() : [];
      if (ch && ch.joined && ch.joined.some(p => !p.sameTab)) this.rebroadcast();
      this.notify();
    }, onErr);
    if (this.myRole) this.chan.presence({ role: this.myRole }).catch(() => { });
  }
  setMyRole(role) { this.myRole = role; if (this.chan) this.chan.presence({ role }).catch(() => { }); }
  rebroadcast() { const r = this.myRole; if (r && this.docs[r] && this.chan) this.chan.emit('doc', { role: r, doc: this.docs[r] }).catch(() => { }); }
  write(role, doc) {
    this.docs[role] = doc; this.notify();
    if (this.chan) this.chan.emit('doc', { role, doc }).catch(() => { });
    if (this.db) this.flush(`${this.base}/roles/${role}`, () => this.docs[role]);
  }
  async flush(path, get) {
    if (this.writing[path]) { this.dirty[path] = true; return; }
    this.writing[path] = true;
    try {
      let tries = 0;
      do {
        this.dirty[path] = false;
        const body = get();
        try { if (body) await this.db.doc(path).set(body); else await this.db.doc(path).delete(); tries = 0; }
        catch (e) {
          const code = e && e.code;
          if ((code === 'unavailable' || code === 'resource_exhausted') && tries < 4) { tries++; this.dirty[path] = true; await sleep(400 + Math.random() * 600 * tries); }

  }
  setPresence(role, p) {
    this._pres = Object.assign({}, this._pres, p, { role });
    if (this.chan) this.chan.presence(this._pres).catch(() => { });
  }
  peerList(role) { return this.peers.filter(p => !p.sameTab && p.kind !== 'agent' && p.presence && p.presence.role === role); }
  peerPresence(role) { const l = this.peerList(role); return l.length ? l[l.length - 1].presence : null; }
  online(role) { return this.peerList(role).length > 0; }
  dupRole(role) { return this.peerList(role).length > 0; }
  saveMoment(id, data) {
    const body = Object.assign({}, data, { id });
    const i = this.moments.findIndex(m => m.id === id);
    if (i >= 0) this.moments[i] = body; else this.moments.push(body);
    this.sortMoments(); this.notify();
    this.momentWrites[id] = body;
    if (this.chan) this.chan.emit('moment', body).catch(() => { });
    if (this.db) this.flush(`${this.base}/moments/${id}`, () => this.momentWrites[id]);
  }
  async clearMoments() {
    const ids = this.moments.map(m => m.id); this.moments = []; this.notify();
    if (!this.db) return;
    for (const id of ids) { this.momentWrites[id] = null; await this.flush(`${this.base}/moments/${id}`, () => null); }
  }
}

/* ---------- one phone's handle on the hub ---------- */
class RoleSync {
  constructor(hub, role) { this.hub = hub; this.role = role; if (hub.host) hub.host(role); if (hub.setMyRole) hub.setMyRole(role); }
  docs() { return this.hub.docs; }
  update(fn) {
    const cur = clone(this.hub.docs[this.role]) || {};
    const next = fn(cur) || cur;
    next.v = Math.max(((this.hub.docs[this.role] && this.hub.docs[this.role].v) || 0) + 1, Date.now());
    next.role = this.role; next.at = Date.now();
    this.hub.write(this.role, next);
  }
  setPresence(p) { this.hub.setPresence(this.role, p); }
}

/* ---------- the shared phase machine (pure) ---------- */
function roundRec(doc, round) { return doc && doc.r && doc.r.round === round ? doc.r : {}; }
function derive(g, e) {
  const V = { phase: 'idle', pipAt: 'both' };
  const latest = Math.max((g && g.at) || 0, (e && e.at) || 0);
  if (!g || !g.sid || g.endSid === g.sid || (e && e.endSid === g.sid) || (latest && Date.now() - latest > STALE_MS)) {
    V.lastSid = g && g.sid; return V;
  }
  const sid = g.sid; V.sid = sid; V.dish = DISHES[g.dish] ? g.dish : 'tomato_egg';
  const eIn = !!(e && e.sid === sid);
  if (!eIn || !e.joinAt) {
    V.phase = eIn && e.declineAt ? 'declined' : 'invited';
    V.pipAt = V.phase === 'invited' ? 'emma' : 'grandma';
    return V;
  }
  const round = Math.max(g.round || 1, e.round || 1); V.round = round;
  const gr = roundRec(g, round), er = roundRec(e, round);
  const core = DISHES[V.dish].core;
  const first = core.includes(gr.first) ? gr.first : null;
  V.order = first ? [first, core.find(c => c !== first)] : [];
  V.secret = DISHES[V.dish].secrets.includes(gr.secret) ? gr.secret : null;
  V.added = Array.isArray(er.added) ? er.added.filter(x => core.includes(x)) : [];
  V.secretIn = !!er.secretIn;
  V.twist = er.twist === 'none' || TWISTS.includes(er.twist) ? er.twist : null;
  V.stirred = !!er.stirred; V.serveAt = gr.serveAt || 0; V.thanks = !!er.thanks;
  V.reply = REPLIES[gr.reply] ? gr.reply : null;
  V.step = 0;
  if (!first) { V.phase = 'pick1'; V.pipAt = 'grandma'; return V; }
  V.step = 1;
  if (!V.added.includes(first)) { V.phase = 'add1'; V.pipAt = 'emma'; return V; }
  V.step = 2;
  if (!V.secret) { V.phase = 'pick2'; V.pipAt = 'grandma'; return V; }
  V.step = 3;
  const second = V.order[1];
  if (!V.added.includes(second) || (V.secret !== 'none' && !V.secretIn)) {
    V.phase = 'add2'; V.pipAt = 'emma'; V.sub = V.added.includes(second) ? 'sprinkle' : 'add'; return V;
  }
  if (!V.twist) { V.phase = 'twist'; V.pipAt = 'emma'; return V; }
  if (!V.serveAt) { V.phase = 'stir'; V.pipAt = 'emma'; V.step = V.stirred ? 4 : 3; return V; }
  V.step = 5; V.phase = 'done'; V.pipAt = 'both'; V.outcome = outcomeOf(V.dish, V.twist);
  return V;
}

/* ---- mqtt-hub.js ---- */
/* ============================================================
   Web build sync: no accounts needed.
   Both phones talk through free public MQTT brokers (real-time
   message servers). Each phone connects to two brokers at once
   and sends every update through both, so one blocked network
   path does not break the demo. Role documents and keepsake
   cards are "retained" on the broker, so a phone that reloads
   gets the current state back immediately.
   ============================================================ */
const PIP_BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];

class MqttHub extends BaseHub {
  constructor(room, opts = {}) {
    super();

    this.room = room; this.prefix = 'pipdemo/v1/' + room + '/';

    const ids = Object.keys(this.momentsMap);

  }
}

  scallion: { n: 14, raw: '#9AD27F', cooked: '#6EB156', size: [2.4, 3.1] },

  /* ---------------- phase effects (tasting, photo) ---------------- */
  async phaseEffects(prev, v, live) {
    if (v.phase !== 'done') { this.el.photo.hidden = true; return; }
    const key = v.sid + ':' + v.round;
    if (this.tasted === key) return;
    this.tasted = key;
    if (!live) return; // opened part-way: go straight to the card
    const L = this.prefs.lang, rx = REACT[v.outcome];
    const say = t => { const b = this.el.bubble; b.hidden = false; b.dataset.v = ''; b.innerHTML = `<p>${esc(t)}</p>`; this.placeBubble(); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); };

      const c = this.cook, mover = this.el.mover;
      SFX.play('ding'); this.setExpression('surprised'); say(this.t('served'));
      await c.serve();
      await sleep(160);

      say(this.t('tasting'));
      const bites = v.outcome === 'blehh' ? 1 : v.outcome === 'odd' ? 2 : 3;
      const lean = reduceMotion() ? null : mover.animate([{ transform: 'none' }, { transform: 'translateX(6%) rotate(7deg)' }], { duration: 260, easing: 'ease-out', fill: 'forwards' });
      for (let i = 0; i < bites; i++) {
        this.setExpression('surprised');
        await sleep(i ? 120 : 260);
        const m = this.pipPoint(0.5, 0.58); m.x += 12;
        await c.bite(m, bites === 1 ? 2.6 : 3.2);
        this.setExpression('chew'); mover.classList.add('chewing'); SFX.play('chew'); haptic(10);
        await sleep(560);
        mover.classList.remove('chewing');
      }
      if (lean) lean.cancel();
      this.setExpression(rx.face); say(rx[L]);
      mover.classList.remove('wiggle', 'shake'); void mover.offsetWidth;
      mover.classList.add(v.outcome === 'blehh' ? 'shake' : 'wiggle');
      c.react(v.outcome, this.pipPoint(0.5, 0.05));
      SFX.play(v.outcome === 'blehh' ? 'blehh' : 'yum'); haptic(v.outcome === 'blehh' ? 60 : 20);
      await sleep(2000);
    } else {
      // Grandma watches Emma plate it up in the porthole; PIP snaps a photo and brings it home
      this.portHold = true; this.renderPort(v, true);
      const m = this.mini, port = this.el.port;
      if (m && !port.hidden) {

        const fl = port.querySelector('.flash'); if (fl) { fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go'); }
        SFX.play('shutter'); await sleep(320);
      }
      this.portHold = false; this.renderPort(v, true);

      this.el.photo.hidden = false; this.el.photo.classList.remove('in'); void this.el.photo.offsetWidth; this.el.photo.classList.add('in');
      SFX.play(v.outcome === 'blehh' ? 'blehh' : 'yum');
      await sleep(2500);
    }
    this.el.photo.hidden = true;
  }

  /* ---------------- input ---------------- */
  onClick(e) {
    const b = e.target.closest('[data-act]'); if (!b || !this.root.contains(b) || b.disabled) return;
    const act = b.dataset.act, arg = b.dataset.arg;
    SFX.unlock();
    const hubBusy = this.hub.kind === 'cloud' && !this.hub.ready;
    const writes = !['sound', 'menu', 'close', 'about', 'moments', 'open-moment', 'pref', 'speak', 'switch', 'both', 'e-stir'].includes(act);
    if (writes && hubBusy) { this.toast(this.t('connecting_hold')); return; }
    if (writes && this.hub.status === 'view') { this.toast(this.t('readonly')); return; }
    haptic();
    const v = this.view, R = v.round || 1;
    const myR = (d) => { if (!d.r || d.r.round !== R) d.r = { round: R }; d.round = Math.max(d.round || 1, R); return d.r; };
    switch (act) {
      case 'sound': SFX.setOn(!SFX.on); this.renderSound(); if (SFX.on) SFX.play('pop'); break;
      case 'menu': this.openOverlay('menu'); break;
      case 'close': this.closeOverlay(); break;
      case 'about': this.openOverlay('about'); break;
      case 'moments': this.openOverlay('moments'); break;
      case 'open-moment': this.openOverlay('moment', arg, false); break;
      case 'speak': { const t = this.el.bubble.dataset.say; if (t) speak(t, this.prefs.lang); break; }
      case 'pref': {
        const [k, val] = arg.split(':');
        if (k === 'sound') { SFX.setOn(val === 'on'); this.renderSound(); }
        else { this.prefs[k] = val; this.savePrefs(); this.applyPrefs(); this.sceneKey = null; this.el.panel.dataset.v = ''; this.el.ribbon.dataset.v = ''; this.el.away.dataset.v = ''; this.el.bubble.dataset.v = ''; this.renderTop(); this.lastKey = null; this.update(); }
        this.openOverlay('menu', null, false); break;
      }
      case 'switch': if (this.onSwitch) this.onSwitch(null); break;
      case 'share-other': {
        const url = this.shareUrl && this.shareUrl(); if (!url) break;
        const label = 'PIP: ' + this.name(this.other);
        const done = () => { const sp = b.querySelector('span'); if (sp) sp.textContent = this.t('copied'); };
        if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) navigator.share({ title: 'PIP', text: label, url }).catch(() => { });
        else if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => { });
        break;
      }
      case 'both': if (this.onSwitch) this.onSwitch('both'); break;
      case 'reset':
        this.closeOverlay(true);
        for (const r of ROLES) this.hub.write(r, { v: Math.max(((this.hub.docs[r] && this.hub.docs[r].v) || 0) + 1, Date.now()), role: r, at: Date.now() });
        this.hub.clearMoments(); this.local.gScreen = 'home'; this.local.laterSaid = false; this.inviteDismissed = {};
        break;
      case 'wave':
        this.sync.update(d => { d.waveAt = Date.now(); return d; });
        this.toast(this.t('waved')); this.setExpression('wave'); this.later(() => this.setExpression(this.exprOf(this.view)), 1500); break;
      // Grandma
      case 'g-yes': this.local.gScreen = 'dishes'; this.update(); SFX.play('pop'); break;
      case 'g-back': this.local.gScreen = 'home'; this.update(); break;
      case 'g-later': this.local.laterSaid = true; this.update(); break;
      case 'g-dish':
        SFX.play('pop');
        this.sync.update(d => ({ waveAt: d.waveAt, sid: uid('s'), dish: arg, inviteAt: Date.now(), round: 1, r: { round: 1 } }));
        break;
      case 'g-first': this.flyToPip(b); this.sync.update(d => { myR(d).first = arg; return d; }); break;
      case 'g-secret': this.flyToPip(b); this.sync.update(d => { myR(d).secret = arg; return d; }); break;
      case 'g-serve': SFX.play('chime'); this.sync.update(d => { myR(d).serveAt = Date.now(); return d; }); break;
      case 'g-reply': SFX.play('pop'); this.sync.update(d => { myR(d).reply = arg; return d; }); break;
      // Emma
      case 'e-join':
        SFX.play('pop'); this.closeOverlay(true);
        this.sync.update(d => ({ waveAt: d.waveAt, sid: v.sid, joinAt: Date.now(), round: 1, r: { round: 1 } }));
        break;
      case 'e-decline':
        this.inviteDismissed = Object.assign({}, this.inviteDismissed, { [v.sid]: true }); this.closeOverlay(true);
        this.sync.update(d => ({ waveAt: d.waveAt, sid: v.sid, declineAt: Date.now(), round: 1 }));
        break;
      case 'e-add': this.addToWok(arg); break;
      case 'e-sprinkle': this.sprinkle(); break;
      case 'e-twist': this.addTwist(arg, b); break;
      case 'e-thank': SFX.play('sparkle'); this.sync.update(d => { myR(d).thanks = true; return d; }); break;
      // both
      case 'again':
        SFX.play('pop'); this.closeOverlay(true); this.tasted = null;
        this.sync.update(d => { d.round = R + 1; d.r = { round: R + 1 }; if (this.role === 'emma') d.sid = v.sid; return d; });
        break;
      case 'end': this.closeOverlay(true); this.sync.update(d => { d.endSid = v.sid; return d; }); break;
    }
  }
  flyToPip(btn) {
    const icon = btn.querySelector('svg'); if (!icon) return;
    SFX.play('pop');
    const from = icon.getBoundingClientRect();
    const to = this.el.carry.getBoundingClientRect();
    const clone = icon.cloneNode(true); clone.classList.add('flyer');
    Object.assign(clone.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
    document.body.appendChild(clone);
    const dx = to.left + to.width / 2 - (from.left + from.width / 2), dy = to.top + to.height / 2 - (from.top + from.height / 2);
    const s = Math.max(0.4, to.width / Math.max(1, from.width));
    const name = btn.dataset.arg;
    if (reduceMotion()) { clone.remove(); this.setCarry(name); return; }
    const a = clone.animate([
      { transform: 'translate(0,0) scale(1)' },
      { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 70}px) scale(${(1 + s) / 2}) rotate(-8deg)` },
      { transform: `translate(${dx}px, ${dy}px) scale(${s})` }
    ], { duration: 480, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards' });
    this.flyPromise = a.finished.catch(() => { }).then(() => { clone.remove(); this.setCarry(name); this.squish(); });
  }
  async waitIdle() { let n = 0; while (this.running && n++ < 60) await sleep(50); }
  busyPanel(on) {
    this.el.panel.classList.toggle('busy', on);
    this.el.panel.querySelectorAll('button').forEach(b => { if (on) { if (!b.disabled) { b.disabled = true; b.dataset.busy = '1'; } } else if (b.dataset.busy) { b.disabled = false; delete b.dataset.busy; } });
  }
  /* the ingredient flies from PIP (or a tile) to just above the wok; the cooking stage takes it from there */
  async flyToWok(fromRect, name) {
    const to = this.worldToClient(DROP.x, DROP.y), size = 44 * to.s;
    const node = document.createElement('div'); node.className = 'flyer'; node.innerHTML = Art.icon(name);
    Object.assign(node.style, { left: (to.x - size / 2) + 'px', top: (to.y - size / 2) + 'px', width: size + 'px', height: size + 'px' });
    document.body.appendChild(node);
    if (!reduceMotion()) {
      SFX.play('pop');
      const sx = fromRect.left + fromRect.width / 2 - to.x, sy = fromRect.top + fromRect.height / 2 - to.y, s0 = Math.max(0.5, fromRect.width / size);
      await node.animate([
        { transform: `translate(${sx}px, ${sy}px) scale(${s0})` },
        { transform: `translate(${sx * 0.45}px, ${Math.min(sy, 0) * 0.45 - 46}px) scale(${(s0 + 1) / 2}) rotate(-10deg)`, offset: 0.55 },
        { transform: 'translate(0px, 0px) scale(1) rotate(0deg)' }
      ], { duration: 460, easing: 'cubic-bezier(.35,.7,.4,1)', fill: 'forwards' }).finished.catch(() => { });
    }
    node.remove();
  }
  async cookIn(k, v) {
    // tell Grandma's porthole right away, so both phones watch it go in together
    this.sync.setPresence({ addK: k, addAt: Date.now(), sid: v.sid, round: v.round });
    this.cook.setHeat(true); haptic(20);
    if (this.pipHereShown) this.setExpression('surprised');
    await this.cook.add(k, { handoff: true });
    if (this.pipHereShown) { this.setExpression('joy'); this.squish(); }
    await sleep(260);
  }
  async addToWok(name, fromRect) {
    if (this.adding) return; this.adding = true;
    try {
      await this.waitIdle();
      const v = this.view; const R = v.round || 1;
      if (!(v.phase === 'add1' || (v.phase === 'add2' && v.sub === 'add'))) return;
      const ing = v.phase === 'add1' ? v.order[0] : v.order[1];
      this.busyPanel(true);
      const rect = fromRect || this.el.carry.getBoundingClientRect();
      this.setCarry(null); this.hideBubble();
      await this.flyToWok(rect, ing);
      await this.cookIn(ing, v);
      this.sync.update(d => { if (!d.r || d.r.round !== R) d.r = { round: R }; const a = Array.isArray(d.r.added) ? d.r.added : []; if (!a.includes(ing)) a.push(ing); d.r.added = a; return d; });
    } finally { this.adding = false; this.busyPanel(false); }
  }
  async sprinkle() {
    if (this.adding) return; this.adding = true;
    try {
      await this.waitIdle();
      const v = this.view; const R = v.round || 1;
      if (!(v.phase === 'add2' && v.sub === 'sprinkle')) return;
      this.busyPanel(true);
      const rect = this.el.carry.getBoundingClientRect();
      this.setCarry(null); this.hideBubble();
      await this.flyToWok(rect, v.secret);
      await this.cookIn(v.secret, v);
      this.sync.update(d => { if (!d.r || d.r.round !== R) d.r = { round: R }; d.r.secretIn = true; return d; });
    } finally { this.adding = false; this.busyPanel(false); }
  }
  async addTwist(k, btn) {
    if (this.adding) return; this.adding = true;
    try {
      const v = this.view; const R = v.round || 1;
      if (v.phase !== 'twist') return;
      this.busyPanel(true);
      if (k !== 'none') {
        const icon = btn.querySelector('svg'); this.hideBubble();
        await this.flyToWok(icon ? icon.getBoundingClientRect() : btn.getBoundingClientRect(), k);
        await this.cookIn(k, v);
      } else { SFX.play('pop'); this.setExpression('happy'); }
      this.stir = 0; this.stirSent = null;
      this.sync.update(d => { if (!d.r || d.r.round !== R) d.r = { round: R }; d.r.twist = k; return d; });
    } finally { this.adding = false; this.busyPanel(false); }
  }
  /* drag the ingredient from PIP into the wok (Standard mode) */
  setupDrag() {
    const carry = this.el.carry, hitEl = this.el.hit;
    let ghost = null, start = null, over = false, pid = null;
    const wokHit = (x, y) => { const r = hitEl.getBoundingClientRect(); return r.width > 0 && x > r.left - 10 && x < r.right + 10 && y > r.top - 20 && y < r.bottom + 10; };
    carry.addEventListener('pointerdown', e => {
      if (!carry.classList.contains('grab') || this.adding) return;
      e.preventDefault(); pid = e.pointerId; try { carry.setPointerCapture(pid); } catch (er) { }
      const r = carry.getBoundingClientRect(); start = { x: e.clientX, y: e.clientY, r };
      ghost = document.createElement('div'); ghost.className = 'flyer drag'; ghost.innerHTML = carry.innerHTML;
      Object.assign(ghost.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
      document.body.appendChild(ghost); carry.style.visibility = 'hidden'; hitEl.classList.add('target');
    });
    carry.addEventListener('pointermove', e => {
      if (!ghost || e.pointerId !== pid) return;
      ghost.style.transform = `translate(${e.clientX - start.x}px, ${e.clientY - start.y}px) scale(1.12) rotate(-6deg)`;
      const o = wokHit(e.clientX, e.clientY); if (o !== over) { over = o; hitEl.classList.toggle('over', o); }
    });
    const end = e => {
      if (!ghost || (e && e.pointerId !== pid)) return;
      const g = ghost; ghost = null; hitEl.classList.remove('target', 'over');
      const hit = e && wokHit(e.clientX, e.clientY); over = false;
      if (hit) {
        const r = g.getBoundingClientRect(); g.remove(); carry.style.visibility = '';
        const v = this.view; this.addToWok(v.phase === 'add1' ? v.order[0] : v.order[1], r);
      } else {
        g.animate([{ transform: g.style.transform || 'none' }, { transform: 'translate(0,0)' }], { duration: 220, easing: 'ease-out' }).finished.catch(() => { }).then(() => { g.remove(); carry.style.visibility = ''; });
      }
    };
    carry.addEventListener('pointerup', end); carry.addEventListener('pointercancel', end);
  }
  /* stir: circle a finger around the wok (Standard) or hold the button (any mode) */
  setupStir() {
    const hitEl = this.el.hit; let last = null, pid = null;
    const angle = e => { const c = this.worldToClient(WOK.cx, WOK.rimY + 6); return Math.atan2((e.clientY - c.y) * 2, e.clientX - c.x); };
    hitEl.addEventListener('pointerdown', e => {
      if (!hitEl.classList.contains('stirring')) return;
      e.preventDefault(); SFX.unlock(); pid = e.pointerId; try { hitEl.setPointerCapture(pid); } catch (er) { } last = angle(e);
    });
    hitEl.addEventListener('pointermove', e => {
      if (last == null || e.pointerId !== pid) return;
      const a = angle(e); let d = a - last; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; last = a;
      this.stirAcc = (this.stirAcc || 0) + d;
      this.addStir(Math.abs(d) / (Math.PI * 2 * 2.2), this.stirAcc);
    });
    const up = () => { last = null; pid = null; };
    hitEl.addEventListener('pointerup', up); hitEl.addEventListener('pointercancel', up);
    // hold-to-stir button lives in the panel (delegated)
    const startHold = e => {
      const b = e.target.closest('[data-act="e-stir"]'); if (!b || b.disabled) return;
      e.preventDefault(); SFX.unlock(); clearInterval(this.holdTimer);
      this.holdTimer = setInterval(() => { this.stirAcc = (this.stirAcc || 0) + 0.42; this.addStir(0.022, this.stirAcc); }, 60);
    };
    const stopHold = () => { clearInterval(this.holdTimer); this.holdTimer = null; };
    this.root.addEventListener('pointerdown', startHold);
    this.root.addEventListener('pointerup', stopHold); this.root.addEventListener('pointercancel', stopHold); this.root.addEventListener('pointerleave', stopHold);
    this.root.addEventListener('keydown', e => {
      if ((e.key === ' ' || e.key === 'Enter') && e.target.closest && e.target.closest('[data-act="e-stir"]')) { e.preventDefault(); this.stirAcc = (this.stirAcc || 0) + 0.9; this.addStir(0.1, this.stirAcc); }
    });
  }
  addStir(amount, ang) {
    const v = this.view; if (v.phase !== 'stir' || v.stirred) return;
    this.stir = Math.min(1, this.stir + amount);
    const c = this.cook; c.stirTo(ang); c.setCook(0.3 + 0.7 * this.stir);
    const now = Date.now();
    if (!this.lastTossAt || now - this.lastTossAt > 620) { this.lastTossAt = now; c.toss(0.9); }
    const bar = this.el.panel.querySelector('.stirbar');
    if (bar) { bar.querySelector('i').style.width = Math.round(this.stir * 100) + '%'; bar.setAttribute('aria-valuenow', Math.round(this.stir * 100)); }
    if (!this.lastSizzle || now - this.lastSizzle > 900) { this.lastSizzle = now; SFX.play('sizzle'); }
    if (now - this.lastPres > 110 || this.stir >= 1) { this.lastPres = now; this.sync.setPresence({ stir: +this.stir.toFixed(3), sid: v.sid, round: v.round }); }
    if (this.stir >= 1 && !this.stirSent) {
      this.stirSent = v.sid + v.round; clearInterval(this.holdTimer);
      SFX.play('yum'); const R = v.round; c.toss(1.15);
      this.sync.update(d => { if (!d.r || d.r.round !== R) d.r = { round: R }; d.r.stirred = true; return d; });
    }
    if (this.stirSent && this.stirSent !== v.sid + v.round) this.stirSent = null;
  }
}
function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---- boot-web.js ---- */
/* ============================================================
   Web build boot (GitHub Pages): no Claude account needed.
   ?room=CODE&role=grandma|emma   one phone
   ?room=CODE                     pick a role / share the other link
   ?view=both  (or #both)         both phones on one screen
   (no params)                    start a new kitchen
   ============================================================ */
(function () {
  const root = document.getElementById('root');
  document.body.insertAdjacentHTML('afterbegin', Art.defs);
  const params = new URLSearchParams(location.search);
  const hashRole = (location.hash || '').replace('#', '');
  const L = 'en';
  const t = k => tr(L, k);
  const cleanRoom = s => String(s || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 24);
  const newRoom = () => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };
  const baseUrl = location.origin + location.pathname;
  const linkFor = (room, role) => `${baseUrl}?room=${encodeURIComponent(room)}${role ? '&role=' + role : ''}`;
  const go = url => { location.href = url; };
  let brokers = null;
  if (params.get('brokers')) brokers = params.get('brokers').split(',').filter(Boolean); // for local testing only

  function qrSvg(text) {
    try {
      const q = window.qrcode(0, 'M'); q.addData(text); q.make();
      return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true, alt: 'QR code' });
    } catch (e) { return ''; }
  }
  async function shareOrCopy(url, btn, label) {
    try {
      if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) { await navigator.share({ title: 'PIP', text: label, url }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); btn.querySelector('span').textContent = 'Copied ✓'; }
    catch (e) { window.prompt && window.prompt('Copy this link', url); }
  }

  function landing() {
    root.innerHTML = `<main class="picker">
      <div class="hero-pip">${pipMarkup('happy')}</div>
      <h1>PIP</h1><p class="tag">Little moments, together</p>
      <h2>Cook together on two phones</h2>
      <p class="sub">Start a kitchen, then one phone plays Grandma and the other plays Emma. No sign-up.</p>
      <div class="role-cards">
        <button type="button" class="btn primary big" data-go="new"><span>Start a new kitchen</span></button>
      </div>
      <button type="button" class="link-btn" data-go="both">${esc(t('pickBoth'))}</button>
    </main>`;
    root.querySelector('[data-go="new"]').onclick = () => go(linkFor(newRoom()));
    root.querySelector('[data-go="both"]').onclick = () => go(baseUrl + '?view=both');
  }

  function roomPage(room) {
    const card = (role, av, name, sub) => {
      const url = linkFor(room, role);
      return `<section class="room-card">
        <div class="rc-head"><span class="av av-${role}" aria-hidden="true">${av}</span><span><b>${esc(name)}</b><span class="s">${esc(sub)}</span></span></div>
        <div class="rc-qr" aria-label="${esc(name)} QR">${qrSvg(url)}</div>
        <div class="rc-actions">
          <a class="btn primary" href="${esc(url)}"><span>Use this phone</span></a>
          <button type="button" class="btn soft" data-share="${role}"><span>Send link</span></button>
        </div></section>`;
    };
    root.innerHTML = `<main class="picker room">
      <div class="room-top">${miniPip('happy')}<b>PIP</b><span class="room-code">Kitchen <code>${esc(room)}</code></span></div>
      <h2>Each phone picks a person</h2>
      <p class="sub">Tap “Use this phone” here. On the other phone, scan its QR code or open the link you send.</p>
      <div class="room-cards">
        ${card('grandma', 'G', 'Grandma', 'Easy mode, bigger text')}
        ${card('emma', 'E', 'Emma', 'Standard mode')}
      </div>
      <button type="button" class="link-btn" data-go="new">Start a different kitchen</button>
    </main>`;
    root.querySelectorAll('[data-share]').forEach(b => b.addEventListener('click', () => {
      const r = b.dataset.share; shareOrCopy(linkFor(room, r), b, r === 'grandma' ? 'PIP: Grandma’s phone' : 'PIP: Emma’s phone');
    }));
    root.querySelector('[data-go="new"]').onclick = () => go(linkFor(newRoom()));
  }

  function phone(room, role) {
    const wrap = document.createElement('div'); wrap.style.height = '100%'; root.appendChild(wrap);
    const hub = new MqttHub(room, brokers ? { brokers } : {});
    const local = new LocalHub('web-' + room, { mode: 'tabs' });
    const app = new PipApp(wrap, {
      role, sync: new RoleSync(hub, role),
      onSwitch: h => go(h === 'both' ? baseUrl + '?view=both' : linkFor(room)),
      shareUrl: () => linkFor(room, otherRole(role)), room
    });
    hub.start().then(ok => {
      if (ok) return;
      // the sync server is unreachable on this network: keep the demo usable on this device and switch back when it connects
      local.start(); app.attach(new RoleSync(local, role)); app.offlineNote = true; app.update();
      const un = hub.subscribe(() => { if (hub.status === 'live') { un(); app.offlineNote = false; app.attach(new RoleSync(hub, role)); } });
    });
  }

  function split() {
    const hub = new LocalHub('web-split', { mode: 'same-screen' });
    root.innerHTML = `<div class="split">
      <header class="split-head"><h1>${miniPip('happy')}PIP</h1><p>Grandma’s Kitchen</p>
        <button type="button" class="btn soft" data-split="reset">Start over</button>
        <a class="btn soft" href="${esc(baseUrl)}">Two real phones</a></header>
      <div class="phones">
        <div class="phone-col"><div class="phone-cap"><span class="av av-grandma" aria-hidden="true">G</span>Grandma’s phone (Easy mode)</div><div class="phone-holder"><div class="phone"><div class="phone-screen" data-p="grandma"></div></div></div></div>
        <div class="phone-col"><div class="phone-cap"><span class="av av-emma" aria-hidden="true">E</span>Emma’s phone (Standard mode)</div><div class="phone-holder"><div class="phone"><div class="phone-screen" data-p="emma"></div></div></div></div>
      </div>
      <p class="split-foot">Both phones run on this one screen. For two real phones, tap “Two real phones”, start a kitchen, and open one link on each phone.</p>
    </div>`;
    const apps = ['grandma', 'emma'].map(r => new PipApp(root.querySelector(`[data-p="${r}"]`), { role: r, sync: new RoleSync(hub, r), split: true }));
    const onResize = () => {
      const s = Math.max(0.42, Math.min(1, (window.innerHeight - 200) / 812, (window.innerWidth - 120) / (2 * 390 + 40)));
      root.querySelectorAll('.phone-holder').forEach(h => h.style.setProperty('--s', s.toFixed(3)));
      root.querySelector('.phones').style.setProperty('--gap', Math.round(46 * s) + 'px');
    };
    onResize(); window.addEventListener('resize', onResize);
    root.querySelector('[data-split="reset"]').addEventListener('click', () => {
      for (const r of ROLES) hub.write(r, { v: Math.max(((hub.docs[r] && hub.docs[r].v) || 0) + 1, Date.now()), role: r, at: Date.now() });
      hub.clearMoments();
      apps.forEach(a => { a.local.gScreen = 'home'; a.local.laterSaid = false; a.inviteDismissed = {}; a.update(); });
    });
  }

  const room = cleanRoom(params.get('room'));
  const role = params.get('role') || (hashRole === 'grandma' || hashRole === 'emma' ? hashRole : '');
  if (params.get('view') === 'both' || hashRole === 'both') return split();
  if (room && (role === 'grandma' || role === 'emma')) return phone(room, role);
  if (room) return roomPage(room);
  return landing();
})();

</script>
