    const body = Object.assign({}, data, { id });
    const i = this.moments.findIndex(m => m.id === id);
    if (i >= 0) this.moments[i] = body; else this.moments.push(body);
    this.sortMoments(); this.notify();
    this.momentWrites[id] = body;
    if (this.chan) this.chan.emit('moment', body).catch(() => { });
    if (this.db) this.flush(`${this.base}/moments/${id}`, () => this.momentWrites[id]);
  }
  savePhoto(role, rec) {
    this.photos[role] = rec; this.notify();
    this.photoWrites = Object.assign({}, this.photoWrites, { [role]: rec });
    if (this.db) this.flush(`${this.base}/photos/${role}`, () => this.photoWrites[role]);
  }
  dropPhoto(role) {
    if (!this.photos[role]) return;
    this.photos[role] = null; this.notify();
    this.photoWrites = Object.assign({}, this.photoWrites, { [role]: null });
    if (this.db) this.flush(`${this.base}/photos/${role}`, () => null);
  }
  async clearMoments() {
    const ids = this.moments.map(m => m.id); this.moments = []; this.photos = { grandma: null, steven: null }; this.notify();
    if (!this.db) return;
    for (const r of ROLES) { this.photoWrites = Object.assign({}, this.photoWrites, { [r]: null }); this.flush(`${this.base}/photos/${r}`, () => null); }
    for (const id of ids) { this.momentWrites[id] = null; await this.flush(`${this.base}/moments/${id}`, () => null); }
  }
}

/* ---------- one phone's handle on the hub ---------- */
class RoleSync {
  constructor(hub, role) { this.hub = hub; this.role = role; if (hub.host) hub.host(role); if (hub.setMyRole) hub.setMyRole(role); }
  docs() { return this.hub.docs; }
  update(fn) {
    const cur = clone(this.hub.docs[this.role]) || {};
    const next = fn(cur) || cur;
    next.v = Math.max(((this.hub.docs[this.role] && this.hub.docs[this.role].v) || 0) + 1, Date.now());
    next.role = this.role; next.at = Date.now();
    this.hub.write(this.role, next);
  }
  setPresence(p) { this.hub.setPresence(this.role, p); }
}

/* ---------- the shared phase machine (pure) ---------- */
function roundRec(doc, round) { return doc && doc.r && doc.r.round === round ? doc.r : {}; }

/* ---- mqtt-hub.js ---- */
/* ============================================================
   Web build sync: no accounts needed.
   Both phones talk through free public MQTT brokers (real-time
   message servers). Each phone connects to two brokers at once
   and sends every update through both, so one blocked network
   path does not break the demo. Role documents and keepsake
   cards are "retained" on the broker, so a phone that reloads
   gets the current state back immediately.
   ============================================================ */
const PIP_BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];

/* Privacy for selfies on public servers.
   From the kitchen code we slowly derive (PBKDF2) two things: the channel name used on the servers,
   and an AES-GCM key. Selfies are encrypted with that key before they leave the phone, so someone
   watching the public servers sees neither the kitchen code nor anyone's face. Only phones that have
   the kitchen link can read them. */
const PipCrypt = {
  ok() { return !!(window.crypto && crypto.subtle && window.TextEncoder); },
  b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  unb64(str) { const b = atob(str), u8 = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u8[i] = b.charCodeAt(i); return u8; },
  async derive(room) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode('pip-kitchen:' + room), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode('pip-demo-v2'), iterations: 100000, hash: 'SHA-256' }, base, 384));
    const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['encrypt', 'decrypt']);
    const id = Array.from(bits.slice(32, 44), b => b.toString(16).padStart(2, '0')).join('');
    return { key, id };
  },
  async seal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
    return { box: 2, iv: this.b64(iv), ct: this.b64(ct) };
  },
  async open(key, sealed) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: this.unb64(sealed.iv) }, key, this.unb64(sealed.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
};

class MqttHub extends BaseHub {
  constructor(room, opts = {}) {
    super();
    this.kind = 'cloud'; this.transport = 'mqtt'; this.status = 'connecting'; this.ready = false; this.canWrite = true;
    this.room = room; this.prefix = 'pipdemo/v1/' + room + '/'; this.key = null; this.sealedMine = null;
    this.brokers = opts.brokers || PIP_BROKERS;
    this.clients = []; this.pres = {}; this.presAt = {}; this.presFrom = {}; this.momentsMap = {};
    this.myRole = null; this.myPres = {}; this.self = uid('c'); this.everUp = false;
  }
  setMyRole(role) { this.myRole = role; this.myPres = Object.assign({}, this.myPres, { role }); this.beat(); }
  start() {
    if (this._start) return this._start;
    this._start = new Promise(async resolve => {
      if (!window.mqtt || typeof window.mqtt.connect !== 'function') { this.status = 'offline'; this.notify(); return resolve(false); }
      // private channel + photo key from the kitchen code (without WebCrypto: old channel, and no selfies are sent)
      if (PipCrypt.ok()) {
        try { const d = await PipCrypt.derive(this.room); this.key = d.key; this.prefix = 'pipdemo/v2/' + d.id + '/'; } catch (e) { this.key = null; }
      }
      let settled = false;
      const done = ok => { if (!settled) { settled = true; resolve(ok); } };
      this.brokers.forEach((url, i) => {
        let c;
        try {
          c = window.mqtt.connect(url, { clientId: 'pip_' + this.self + '_' + i, clean: true, keepalive: 20, reconnectPeriod: 2500, connectTimeout: 8000, protocolVersion: 4 });
        } catch (e) { return; }
        const rec = { url, c, up: false };
        this.clients.push(rec);
        c.on('connect', () => {
          rec.up = true; this.everUp = true; this.updateStatus();
          c.subscribe([this.prefix + 'role/+', this.prefix + 'moment/+', this.prefix + 'pres/+', this.prefix + 'photo/+', this.prefix + 'hello'], { qos: 1 }, () => { });
          // put our own state back on this broker (it may have missed writes while it was down)
          this.republish(rec);
          this.sendTo(rec, 'hello', { from: this.self }, false, 0);
          setTimeout(() => { if (!this.ready) { this.ready = true; this.notify(); } }, 900);
          done(true);
        });
        c.on('message', (topic, payload) => this.onMessage(topic, payload));
        c.on('close', () => { if (rec.up) { rec.up = false; this.updateStatus(); } });
        c.on('offline', () => { if (rec.up) { rec.up = false; this.updateStatus(); } });
        c.on('error', () => { });
      });
      setTimeout(() => { const up = this.clients.some(r => r.up); if (!up) { this.status = 'offline'; this.notify(); } done(up); }, 9500);
    });

  }
  updateStatus() {
    const up = this.clients.some(r => r.up);

    this.notify();
  }
  sendTo(rec, topic, obj, retain, qos = 1) {
    if (!rec.up) return;
    try { rec.c.publish(this.prefix + topic, obj == null ? '' : JSON.stringify(obj), { qos, retain: !!retain }); } catch (e) { }
  }
  pub(topic, obj, retain, qos = 1) { this.clients.forEach(r => this.sendTo(r, topic, obj, retain, qos)); }
  republish(rec) {
    if (this.myRole && this.docs[this.myRole]) this.sendTo(rec, 'role/' + this.myRole, this.docs[this.myRole], true);
    if (this.myRole && this.sealedMine && this.photos[this.myRole] && this.photos[this.myRole].from === this.self) this.sendTo(rec, 'photo/' + this.myRole, this.sealedMine, true);
  }
  onMessage(topic, payload) {
    if (topic.indexOf(this.prefix) !== 0) return;
    const rest = topic.slice(this.prefix.length);
    const s = payload ? payload.toString() : '';
    let data = null;
    if (s) { try { data = JSON.parse(s); } catch (e) { return; } }
    if (rest.indexOf('role/') === 0) {
      const role = rest.slice(5);
      if (data) this.accept(role, data);
    } else if (rest.indexOf('moment/') === 0) {
      const id = rest.slice(7);
      if (!data) delete this.momentsMap[id];
      else if (typeof data === 'object' && DISHES[data.dish]) this.momentsMap[id] = Object.assign({}, data, { id });
      this.moments = Object.values(this.momentsMap); this.sortMoments(); this.notify();
    } else if (rest.indexOf('pres/') === 0) {
      const role = rest.slice(5);
      if (!data || data.from === this.self || !ROLES.includes(role)) return;
      this.pres[role] = data; this.presAt[role] = Date.now(); this.presFrom[role] = data.from; this.notify();
    } else if (rest.indexOf('photo/') === 0) {
      const role = rest.slice(6);
      if (!data) { this.acceptPhoto(role, null); return; }
      if (typeof data !== 'object') return;
      // plain records may only say "skipped" (no face); faces only arrive sealed
      if (data.box !== 2) { if (data.skipped === true && data.role === role && !data.data) this.acceptPhoto(role, data); return; }
      if (!this.key) return;
      PipCrypt.open(this.key, data).then(rec => {
        if (rec && typeof rec === 'object' && rec.role === role && (rec.skipped || (typeof rec.data === 'string' && rec.data.indexOf('data:image/') === 0))) this.acceptPhoto(role, rec);
      }).catch(() => { /* not our kitchen's key: ignore */ });
    } else if (rest === 'hello') {
      if (data && data.from !== this.self) { this.beat(); }
    }
  }
  write(role, doc) { this.docs[role] = doc; this.notify(); this.pub('role/' + role, doc, true); }
  beat() { if (this.myRole) this.pub('pres/' + this.myRole, Object.assign({}, this.myPres, { from: this.self, t: Date.now() }), false, 0); }
  setPresence(role, p) { this.myPres = Object.assign({}, this.myPres, p, { role }); this.pub('pres/' + role, Object.assign({}, this.myPres, { from: this.self, t: Date.now() }), false, 0); }
  fresh(role) { return Date.now() - (this.presAt[role] || 0) < 6500; }
  peerPresence(role) { return this.fresh(role) ? this.pres[role] : null; }
  online(role) { return this.fresh(role); }
  dupRole(role) { return role === this.myRole && this.fresh(role) && this.presFrom[role] && this.presFrom[role] !== this.self; }
  saveMoment(id, data) {
    const body = Object.assign({}, data, { id });
    this.momentsMap[id] = body; this.moments = Object.values(this.momentsMap); this.sortMoments(); this.notify();
    this.pub('moment/' + id, body, true);
  }
  savePhoto(role, rec) {
    // without a key (no WebCrypto) the face never leaves this phone: the other phone sees the drawn portrait
    const r = Object.assign({}, rec, { from: this.self }); this.photos[role] = r; this.notify();
    if (!this.key) { const plain = { sid: r.sid, round: r.round, role: r.role, at: r.at, skipped: true, from: r.from }; this.sealedMine = plain; this.pub('photo/' + role, plain, true); return; }
    PipCrypt.seal(this.key, r).then(sealed => {
      if (this.photos[role] !== r) return; // replaced or dropped meanwhile
      this.sealedMine = sealed; this.pub('photo/' + role, sealed, true);
    }).catch(() => { });
  }
  // the session moved on: take our selfie off the servers (the finished group photo stays on each phone)
  dropPhoto(role) {
    const p = this.photos[role];
    if (!p || role !== this.myRole) return;
    this.sealedMine = null; this.photos[role] = null; this.notify();
    this.pub('photo/' + role, null, true);
  }
  clearMoments() {
    const ids = Object.keys(this.momentsMap);
    this.momentsMap = {}; this.moments = []; this.photos = { grandma: null, steven: null }; this.notify();
    ids.forEach(id => this.pub('moment/' + id, null, true));
    ROLES.forEach(r => this.pub('photo/' + r, null, true));
  }
}

/* ============================================================
   Cooking stage (canvas)

   pouring, sprinkling), stirring and wok tosses, steam and oil,
   plating, PIP's bites and reactions.
   Everything is drawn in world units (390 x 420), the same space
   as the illustrated kitchen behind it.

const COOK_G = 980;

  scallion: { n: 14, raw: '#9AD27F', cooked: '#6EB156', size: [2.4, 3.1] },

class CookStage {

        } else if (p.home === 'plate') {

/* ============================================================
   Selfies and the group photo.
   Each phone takes its own selfie (front camera, or a picked photo),
   shares it through the same sync hub as everything else, and then
   draws the same keepsake picture: both selfies, PIP, and the dish.

const PHOTO_PX = 320;

  let q = 0.82, u = c.toDataURL('image/jpeg', q);
  while (u.length > max && q > 0.4) { q -= 0.12; u = c.toDataURL('image/jpeg', q); }

class SelfieCam {
  constructor() { this.stream = null; }
  static supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
  async start(video) {
    this.stop();

  return new Promise((res, rej) => {

  /* ---------------- phase effects (tasting, photo) ---------------- */
  async phaseEffects(prev, v, live) {
    if (v.phase !== 'done') { this.el.photo.hidden = true; return; }
    const key = v.sid + ':' + v.round;
    if (this.tasted === key) return;
    this.tasted = key;
    if (!live) return; // opened part-way: go straight to the card
    const L = this.prefs.lang, rx = REACT[v.outcome];
    const say = t => { const b = this.el.bubble; b.hidden = false; b.dataset.v = ''; b.innerHTML = `<p>${esc(t)}</p>`; this.placeBubble(); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); };
    if (this.role === 'steven') {
      const c = this.cook, mover = this.el.mover;
      SFX.play('ding'); this.setExpression('surprised'); say(this.t('served'));
      await c.serve();
      await sleep(160);
      // PIP leans over the plate and takes a few bites
      say(this.t('tasting'));
      const bites = v.outcome === 'blehh' ? 1 : v.outcome === 'odd' ? 2 : 3;
      const lean = reduceMotion() ? null : mover.animate([{ transform: 'none' }, { transform: 'translateX(6%) rotate(7deg)' }], { duration: 260, easing: 'ease-out', fill: 'forwards' });
      for (let i = 0; i < bites; i++) {
        this.setExpression('surprised');
        await sleep(i ? 120 : 260);
        const m = this.pipPoint(0.5, 0.58); m.x += 12;
        await c.bite(m, bites === 1 ? 2.6 : 3.2);
        this.setExpression('chew'); mover.classList.add('chewing'); SFX.play('chew'); haptic(10);
        await sleep(560);
        mover.classList.remove('chewing');
      }
      if (lean) lean.cancel();
      this.setExpression(rx.face); say(rx[L]);
      mover.classList.remove('wiggle', 'shake'); void mover.offsetWidth;
      mover.classList.add(v.outcome === 'blehh' ? 'shake' : 'wiggle');
      c.react(v.outcome, this.pipPoint(0.5, 0.05));
      SFX.play(v.outcome === 'blehh' ? 'blehh' : 'yum'); haptic(v.outcome === 'blehh' ? 60 : 20);
      await sleep(2000);
    } else {
      // Grandma watches Steven plate it up in the porthole; PIP snaps a photo and brings it home
      this.portHold = true; this.renderPort(v, true);
      const m = this.mini, port = this.el.port;
      if (m && !port.hidden) {
        m.ensure(this.cookItems(v), false);
        await m.serve();
        const fl = port.querySelector('.flash'); if (fl) { fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go'); }
        SFX.play('shutter'); await sleep(320);
      }
      this.portHold = false; this.renderPort(v, true);
      this.el.photo.innerHTML = `<div class="polaroid">${Art.dish(v.dish, v.twist !== 'none' ? v.twist : null)}${pipMarkup(rx.face, 'ph-pip')}<p>${esc(rx[L])}</p></div>`;
      this.el.photo.hidden = false; this.el.photo.classList.remove('in'); void this.el.photo.offsetWidth; this.el.photo.classList.add('in');
      SFX.play(v.outcome === 'blehh' ? 'blehh' : 'yum');
      await sleep(2500);
    }
    this.el.photo.hidden = true;
  }

  /* the ingredient flies from PIP (or a tile) to just above the wok; the cooking stage takes it from there */

  }
  /* drag the ingredient from PIP into the wok (Standard mode) */
  setupDrag() {

    const wokHit = (x, y) => { const r = hitEl.getBoundingClientRect(); return r.width > 0 && x > r.left - 10 && x < r.right + 10 && y > r.top - 20 && y < r.bottom + 10; };

function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---- boot-web.js ---- */
/* ============================================================
   Web build boot (GitHub Pages): no Claude account needed.
   ?room=CODE&role=grandma|steven   one phone
   ?room=CODE                     pick a role / share the other link
   ?view=both  (or #both)         both phones on one screen
   (no params)                    start a new kitchen
   ============================================================ */
(function () {
  const root = document.getElementById('root');
  document.body.insertAdjacentHTML('afterbegin', Art.defs);
  const params = new URLSearchParams(location.search);
  const hashRole = (location.hash || '').replace('#', '');
  const L = 'en';
  const t = k => tr(L, k);
  const cleanRoom = s => String(s || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 24);
  const newRoom = () => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const r = crypto.getRandomValues(new Uint32Array(8)); for (let i = 0; i < 8; i++) s += a[r[i] % a.length]; return s; };
  const baseUrl = location.origin + location.pathname;
  const linkFor = (room, role) => `${baseUrl}?room=${encodeURIComponent(room)}${role ? '&role=' + role : ''}`;
  const go = url => { location.href = url; };
  let brokers = null;
  if (params.get('brokers')) brokers = params.get('brokers').split(',').filter(Boolean); // for local testing only

  function qrSvg(text) {
    try {
      const q = window.qrcode(0, 'M'); q.addData(text); q.make();
      return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true, alt: 'QR code' });
    } catch (e) { return ''; }
  }
  async function shareOrCopy(url, btn, label) {
    try {
      if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) { await navigator.share({ title: 'PIP', text: label, url }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); btn.querySelector('span').textContent = 'Copied ✓'; }
    catch (e) { window.prompt && window.prompt('Copy this link', url); }
  }

  function landing() {
    root.innerHTML = `<main class="picker">
      <div class="hero-pip">${pipMarkup('happy')}</div>
      <h1>PIP</h1><p class="tag">Little moments, together</p>
      <h2>Cook together on two phones</h2>
      <p class="sub">Start a kitchen, then one phone plays Grandma and the other plays Steven. No sign-up.</p>
      <div class="role-cards">
        <button type="button" class="btn primary big" data-go="new"><span>Start a new kitchen</span></button>
      </div>
      <button type="button" class="link-btn" data-go="both">${esc(t('pickBoth'))}</button>
    </main>`;
    root.querySelector('[data-go="new"]').onclick = () => go(linkFor(newRoom()));
    root.querySelector('[data-go="both"]').onclick = () => go(baseUrl + '?view=both');
  }

  function roomPage(room) {
    const card = (role, av, name, sub) => {
      const url = linkFor(room, role);
      return `<section class="room-card">
        <div class="rc-head"><span class="av av-${role}" aria-hidden="true">${av}</span><span><b>${esc(name)}</b><span class="s">${esc(sub)}</span></span></div>
        <div class="rc-qr" aria-label="${esc(name)} QR">${qrSvg(url)}</div>
        <div class="rc-actions">
          <a class="btn primary" href="${esc(url)}"><span>Use this phone</span></a>
          <button type="button" class="btn soft" data-share="${role}"><span>Send link</span></button>
        </div></section>`;
    };
    root.innerHTML = `<main class="picker room">
      <div class="room-top">${miniPip('happy')}<b>PIP</b><span class="room-code">Kitchen <code>${esc(room)}</code></span></div>
      <h2>Each phone picks a person</h2>
      <p class="sub">Tap “Use this phone” here. On the other phone, scan its QR code or open the link you send.</p>
      <div class="room-cards">
        ${card('grandma', 'G', 'Grandma', 'Easy mode, bigger text')}
        ${card('steven', 'S', 'Steven', 'Standard mode')}
      </div>
      <button type="button" class="link-btn" data-go="new">Start a different kitchen</button>
    </main>`;
    root.querySelectorAll('[data-share]').forEach(b => b.addEventListener('click', () => {
      const r = b.dataset.share; shareOrCopy(linkFor(room, r), b, r === 'grandma' ? 'PIP: Grandma’s phone' : 'PIP: Steven’s phone');
    }));
    root.querySelector('[data-go="new"]').onclick = () => go(linkFor(newRoom()));
  }

  function phone(room, role) {
    const wrap = document.createElement('div'); wrap.style.height = '100%'; root.appendChild(wrap);
    const hub = new MqttHub(room, brokers ? { brokers } : {});
    const local = new LocalHub('web-' + room, { mode: 'tabs' });
    const app = new PipApp(wrap, {
      role, sync: new RoleSync(hub, role),
      onSwitch: h => go(h === 'both' ? baseUrl + '?view=both' : linkFor(room)),
      shareUrl: () => linkFor(room, otherRole(role)), room
    });
    hub.start().then(ok => {
      if (ok) return;
      // the sync server is unreachable on this network: keep the demo usable on this device and switch back when it connects
      local.start(); app.attach(new RoleSync(local, role)); app.offlineNote = true; app.update();
      const un = hub.subscribe(() => { if (hub.status === 'live') { un(); app.offlineNote = false; app.attach(new RoleSync(hub, role)); } });
    });
  }

  function split() {
    const hub = new LocalHub('web-split', { mode: 'same-screen' });
    root.innerHTML = `<div class="split">
      <header class="split-head"><h1>${miniPip('happy')}PIP</h1><p>Grandma’s Kitchen</p>
        <button type="button" class="btn soft" data-split="reset">Start over</button>
        <a class="btn soft" href="${esc(baseUrl)}">Two real phones</a></header>
      <div class="phones">
        <div class="phone-col"><div class="phone-cap"><span class="av av-grandma" aria-hidden="true">G</span>Grandma’s phone (Easy mode)</div><div class="phone-holder"><div class="phone"><div class="phone-screen" data-p="grandma"></div></div></div></div>
        <div class="phone-col"><div class="phone-cap"><span class="av av-steven" aria-hidden="true">S</span>Steven’s phone (Standard mode)</div><div class="phone-holder"><div class="phone"><div class="phone-screen" data-p="steven"></div></div></div></div>
      </div>
      <p class="split-foot">Both phones run on this one screen. For two real phones, tap “Two real phones”, start a kitchen, and open one link on each phone.</p>
    </div>`;
    const apps = ['grandma', 'steven'].map(r => new PipApp(root.querySelector(`[data-p="${r}"]`), { role: r, sync: new RoleSync(hub, r), split: true }));
    const onResize = () => {
      const s = Math.max(0.42, Math.min(1, (window.innerHeight - 200) / 812, (window.innerWidth - 120) / (2 * 390 + 40)));
      root.querySelectorAll('.phone-holder').forEach(h => h.style.setProperty('--s', s.toFixed(3)));
      root.querySelector('.phones').style.setProperty('--gap', Math.round(46 * s) + 'px');
    };
    onResize(); window.addEventListener('resize', onResize);
    root.querySelector('[data-split="reset"]').addEventListener('click', () => {
      for (const r of ROLES) hub.write(r, { v: Math.max(((hub.docs[r] && hub.docs[r].v) || 0) + 1, Date.now()), role: r, at: Date.now() });
      hub.clearMoments();
      apps.forEach(a => { a.local.gScreen = 'home'; a.local.laterSaid = false; a.inviteDismissed = {}; a.update(); });
    });
  }

  const room = cleanRoom(params.get('room'));
  let role = params.get('role') || (hashRole === 'grandma' || hashRole === 'steven' || hashRole === 'emma' ? hashRole : '');
  if (role === 'emma') role = 'steven'; // links shared before the rename
  if (params.get('view') === 'both' || hashRole === 'both') return split();
  if (room && (role === 'grandma' || role === 'steven')) return phone(room, role);
  if (room) return roomPage(room);
  return landing();
})();

</script>
