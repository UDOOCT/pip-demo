<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD28E">
<title>PIP Grandma's Kitchen</title>
<meta name="description" content="PIP: a shared fluffy companion for two phones. Grandma teaches, Steven cooks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2228%22 fill=%22%23FFFDF8%22 stroke=%22%23F4E6D1%22 stroke-width=%224%22/%3E%3Cellipse cx=%2224%22 cy=%2230%22 rx=%222.4%22 ry=%224%22 fill=%22%235A3B31%22/%3E%3Cellipse cx=%2240%22 cy=%2230%22 rx=%222.4%22 ry=%224%22 fill=%22%235A3B31%22/%3E%3Cellipse cx=%2218%22 cy=%2238%22 rx=%225%22 ry=%223%22 fill=%22%23FFB3B5%22/%3E%3Cellipse cx=%2246%22 cy=%2238%22 rx=%225%22 ry=%223%22 fill=%22%23FFB3B5%22/%3E%3Cpath d=%22M27 36 Q32 35 37 36 Q36.5 43 32 43 Q27.5 43 27 36Z%22 fill=%22%236A4C42%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Honey afternoon: PIP's sketch background is the brand colour; one cozy light world */
  --honey: #FFD28E;
  --cream: #FFF7EA;
  --cocoa: #4B2E24;
  --blush: #FFB3B5;
  --sage: #A9CF9F;
  --tomato: #E9654F;
  /* derived */
  --honey-deep: #F7B65A;
  --honey-edge: #D9913A;
  --cream-2: #FCEBD2;
  --paper: #FFFDF8;
  --cocoa-2: #6E4B3B;
  --line: #EED6B3;
  --sage-ink: #3F6B3B;
  --shadow: rgba(122, 78, 40, .18);
  --font-display: "Fredoka", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", ui-rounded, system-ui, sans-serif;
  /* layout: phone-first stage (the illustrated room where PIP lives) above a soft sheet with one clear action */
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body, #root { height: 100%; margin: 0; }
body { background: var(--honey); color: var(--cocoa); font-family: var(--font-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--cocoa); outline-offset: 3px; border-radius: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- mini PIP (logo, chips, stickers) ---------- */
.mini-pip { position: relative; display: inline-block; width: 30px; height: 30px; flex: none; vertical-align: middle; }
.mini-pip .mp-body { position: absolute; inset: -6%; background-size: 100% 100%; }
.mini-pip .pip-face { position: absolute; inset: -6%; width: 112%; height: 112%; }

/* ---------- app shell ---------- */
.app { position: relative; height: 100%; width: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--honey); isolation: isolate; font-size: 16px; }
.app.mode-easy { font-size: 20px; }
.topbar { position: absolute; z-index: 30; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: calc(env(safe-area-inset-top) + 10px) 12px 8px; pointer-events: none; }
.topbar .tb-row2 { flex-basis: 100%; display: flex; align-items: center; gap: 6px; }
.topbar > * { pointer-events: auto; }
/* a soft cream wash so the wordmark and chips stay readable over the busy room */
.topbar::before { content: ""; position: absolute; z-index: -1; inset: 0 0 -22px 0; background: linear-gradient(to bottom, rgba(255, 244, 226, .9) 0%, rgba(255, 244, 226, .72) 55%, rgba(255, 244, 226, 0) 100%); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 6px; min-width: 0; }
.brand .mini-pip { width: 32px; height: 32px; }
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .12em; color: var(--cocoa); }
.sync-pill { display: inline-flex; align-items: center; gap: 5px; font: 700 10.5px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: rgba(255, 253, 248, .9); color: var(--cocoa-2); white-space: nowrap; }
.sync-pill i { width: 7px; height: 7px; border-radius: 50%; background: #B9A089; }
.sync-pill.st-live i { background: #3E9B4F; box-shadow: 0 0 0 3px rgba(62, 155, 79, .2); animation: pulse 2s infinite; }
.sync-pill.st-connecting i { background: #E3A43A; animation: pulse 1s infinite; }
.sync-pill.st-view i { background: #C7643F; }
.partner { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: rgba(255, 253, 248, .92); box-shadow: 0 2px 0 var(--shadow); font-weight: 700; font-size: 13px; white-space: nowrap; }
.mode-easy .partner { font-size: 15px; }
.partner .pdot { width: 8px; height: 8px; border-radius: 50%; background: #C9B39C; }
.partner .pdot.on { background: #3E9B4F; }
.partner .pst { color: var(--cocoa-2); font-weight: 600; }
.av { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font: 700 13px/1 var(--font-display); color: var(--cocoa); flex: none; }
.av-grandma { background: var(--sage); }
.av-steven { background: var(--blush); }
.av.big { width: 46px; height: 46px; font-size: 22px; }
.tb-actions { display: flex; gap: 6px; margin-left: auto; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255, 253, 248, .92); box-shadow: 0 2px 0 var(--shadow); display: grid; place-items: center; color: var(--cocoa); padding: 0; }
.mode-easy .iconbtn { width: 50px; height: 50px; }
.iconbtn svg { width: 22px; height: 22px; fill: currentColor; }
.iconbtn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--shadow); }
.banner { position: absolute; z-index: 29; top: calc(env(safe-area-inset-top) + 104px); left: 12px; right: 12px; background: #FFF3D6; border: 2px solid var(--honey-edge); color: var(--cocoa); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 13px; }
.toasts { position: absolute; z-index: 40; top: calc(env(safe-area-inset-top) + 100px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; background: var(--paper); color: var(--cocoa); border-radius: 999px; padding: 8px 14px 8px 8px; box-shadow: 0 6px 20px var(--shadow), 0 2px 0 var(--shadow); font-weight: 700; font-size: 14px; max-width: 90%; animation: toast-in .35s cubic-bezier(.2, 1.4, .4, 1) both; }
.mode-easy .toast { font-size: 18px; }
.toast .ing.ti, .toast .mini-pip.ti { width: 30px; height: 30px; }
.toast.out { animation: toast-out .4s ease both; }

/* ---------- stage & world ---------- */
.stage { position: relative; flex: 1 1 auto; min-height: 150px; overflow: hidden; background-color: #FFF0DA; background-image: radial-gradient(#F7DDB8 2.2px, transparent 2.6px), radial-gradient(#F7DDB8 2.2px, transparent 2.6px); background-size: 26px 26px; background-position: 6px 6px, 19px 19px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.world { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); aspect-ratio: 390 / 420; width: 100%; }
.scene-wrap, .scene-wrap .scene-pack, .scene-wrap .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene-wrap .scene-pack.fade-in { animation: fade-in .45s ease both; }
/* the hand-drawn scene is static: give it its own layer so nothing else forces the wobble filter to re-run */
.scene-pack > .scene:first-child { will-change: transform; }
.scene-fx { pointer-events: none; }
.scene-steam path { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; animation: wisp 3.4s ease-in-out infinite; }
.scene-steam .w2 { animation-delay: 1.1s; } .scene-steam .w3 { animation-delay: 2.2s; }
.cook-cv, .fx-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.cook-cv { z-index: 3; }
.fx-cv { z-index: 8; }
.cook-cv[hidden] { display: none; }
/* touch area over the wok: drop target and stirring circle (world units: x 180-360, y 150-310) */
.wok-hit { position: absolute; z-index: 4; left: 46.15%; width: 46.15%; top: 35.7%; height: 38.1%; touch-action: none; }
.wok-hit .drop-ring { position: absolute; left: 3.3%; width: 88.9%; top: 48%; height: 28%; border-radius: 50%; border: 3px dashed transparent; pointer-events: none; transition: border-color .2s, background .2s; }
.wok-hit.target .drop-ring { border-color: rgba(75, 46, 36, .45); }
.wok-hit.over .drop-ring { border-color: var(--tomato); background: rgba(255, 210, 142, .3); }
.wok-hit.stirring { cursor: grab; }
.wok-hit.stirring:active { cursor: grabbing; }
.wok-hit .stir-guide { position: absolute; left: 47.8%; top: 64%; width: 94%; height: 32%; transform: translate(-50%, -50%); overflow: visible; pointer-events: none; opacity: 0; transition: opacity .3s; }
.wok-hit.stirring .stir-guide { opacity: 1; }
.stir-guide ellipse { fill: none; stroke: rgba(75, 46, 36, .42); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 7 9; vector-effect: non-scaling-stroke; animation: dash-run 1.1s linear infinite; }

/* ---------- PIP ---------- */
.pip-actor { position: absolute; z-index: 6; left: calc(var(--x, 44%) - var(--w, 30%) / 2); bottom: var(--y, 14%); width: var(--w, 30%); aspect-ratio: 1; transition: left .7s cubic-bezier(.4, 0, .2, 1), bottom .7s cubic-bezier(.4, 0, .2, 1); }
.pip-mover { position: absolute; inset: 0; transform-origin: 50% 95%; will-change: transform; }
.pip { position: absolute; inset: 0; transform-origin: 50% 92%; animation: breathe 2.8s ease-in-out infinite; }
.pip::before { content: ""; position: absolute; left: 25%; right: 25%; bottom: 3.5%; height: 7%; border-radius: 50%; background: rgba(110, 70, 40, .22); filter: blur(2px); }
.pip-face { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pip-body { position: absolute; inset: 0; background-size: 100% 100%; animation: fur 7s ease-in-out infinite alternate; }
.pip .pip-gaze { transform: translate(var(--gx, 0px), var(--gy, 0px)); transition: transform .35s cubic-bezier(.3, .7, .3, 1); }
.pip .ck { transition: opacity .3s; }
.pip.glow .ck { opacity: 1; }
.pip-face-wrap { position: absolute; inset: 0; }
.pip .pip-eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.pip-mover.wiggle { animation: wiggle .9s ease; }
.pip-mover.shake { animation: shake .6s ease 2; }
.pip-mover.chewing .pip { animation: chew .32s ease-in-out infinite; }
.carry { position: absolute; left: 50%; top: -34%; width: 50%; aspect-ratio: 1; transform: translateX(-50%); z-index: 2; touch-action: none; }
.carry:empty { pointer-events: none; }
.carry .ing { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 0 rgba(91, 58, 46, .18)); animation: bob 1.6s ease-in-out infinite; }
.carry.grab { cursor: grab; }
.carry.grab::after { content: ""; position: absolute; inset: -12%; border-radius: 50%; border: 3px dashed rgba(75, 46, 36, .45); animation: spin-plain 8s linear infinite; }
.carry .spark { position: absolute; right: -10%; top: -6%; width: 34%; aspect-ratio: 1; background: radial-gradient(circle, #fff 0 20%, transparent 22%), conic-gradient(from 0deg, transparent 0 40deg, #FFE7A8 40deg 50deg, transparent 50deg 130deg, #FFE7A8 130deg 140deg, transparent 140deg 220deg, #FFE7A8 220deg 230deg, transparent 230deg 310deg, #FFE7A8 310deg 320deg, transparent 320deg); border-radius: 50%; animation: twinkle 1.2s ease-in-out infinite; }
.bubble { position: absolute; left: 50%; bottom: 104%; transform: translateX(calc(-30% + var(--bx, 0px))); width: max-content; max-width: min(250px, 72vw); background: var(--paper); border-radius: 18px; padding: 9px 13px; box-shadow: 0 3px 0 var(--shadow), 0 8px 20px rgba(122, 78, 40, .12); font-weight: 700; font-size: 15px; line-height: 1.3; z-index: 7; }
.mode-easy .bubble { font-size: 19px; max-width: min(300px, 80vw); padding: 11px 15px; }
.bubble::after { content: ""; position: absolute; left: calc(26% - var(--bx, 0px)); bottom: -9px; width: 18px; height: 18px; background: var(--paper); transform: rotate(45deg); border-radius: 3px; box-shadow: 3px 3px 0 var(--shadow); }
.bubble p { margin: 0; position: relative; z-index: 1; }
.bubble p.b2 { margin-top: 4px; font-size: .86em; color: var(--cocoa-2); }
.bubble .speak { position: relative; z-index: 1; margin-top: 6px; border: 0; background: var(--cream-2); border-radius: 999px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
.bubble .speak svg { width: 22px; height: 22px; fill: var(--cocoa); }
.bubble.pop { animation: bubble-in .4s cubic-bezier(.2, 1.4, .4, 1) both; }
.pip-actor.has-carry .bubble { bottom: 146%; }

.away { position: absolute; z-index: 5; bottom: 16%; display: flex; align-items: center; gap: 8px; }
[data-role="grandma"] .away { right: 4%; flex-direction: row; }
[data-role="steven"] .away { left: 4%; flex-direction: row-reverse; }
.away-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 253, 248, .94); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 700; font-size: 13px; box-shadow: 0 2px 0 var(--shadow); }
.mode-easy .away-chip { font-size: 16px; }
.away .steps { display: flex; gap: 7px; }
.away .steps i { width: 10px; height: 7px; border-radius: 50%; background: rgba(110, 70, 40, .25); animation: steps 1.8s infinite; }
.away .steps i:nth-child(2) { animation-delay: .3s; } .away .steps i:nth-child(3) { animation-delay: .6s; }

/* porthole: live window into the other kitchen */
.porthole { position: absolute; z-index: 8; right: 14px; top: calc(env(safe-area-inset-top) + 104px); display: flex; flex-direction: column; align-items: center; gap: 4px; animation: pop-in .4s cubic-bezier(.2, 1.4, .4, 1) both; }
[data-role="steven"] .porthole { left: 14px; right: auto; }
.porthole.center { left: 50%; right: auto; transform: translateX(-50%); animation: none; }
.port-ring { width: 118px; aspect-ratio: 1; border-radius: 50%; padding: 6px; background: conic-gradient(var(--tomato) var(--deg, 0deg), rgba(255, 253, 248, .9) 0); box-shadow: 0 3px 0 var(--shadow), 0 10px 22px rgba(122, 78, 40, .16); }
.mode-easy .port-ring { width: 140px; }
.port-ring.calm { background: rgba(255, 253, 248, .92); }
.port-in { width: 100%; height: 100%; border-radius: 50%; background: #FFF0DA; display: grid; place-items: center; overflow: hidden; border: 3px solid var(--paper); position: relative; }
.port-in.w { background: #FFF0DA; display: block; }
.port-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.port-in .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.port-in .flash.go { animation: flash .5s ease-out; }
.port-in.g { background: linear-gradient(#FDEBC8, #FFE0B0); }
.port-in .port-pip { width: 62%; height: 62%; }
.port-in .av.big { position: absolute; right: 8%; bottom: 8%; width: 36%; height: 36%; font-size: 17px; border: 3px solid var(--paper); }
.port-lbl { background: var(--paper); border-radius: 999px; padding: 4px 10px; font-weight: 800; font-size: 12.5px; box-shadow: 0 2px 0 var(--shadow); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.mode-easy .port-lbl { font-size: 15px; }
.port-lbl .mini-pip { width: 22px; height: 22px; margin: -3px 0 -3px -4px; }
.photo { position: absolute; z-index: 12; inset: 0; display: grid; place-items: center; pointer-events: none; }
.polaroid { width: 64%; max-width: 250px; background: var(--paper); padding: 10px 10px 14px; border-radius: 8px; box-shadow: 0 10px 30px rgba(122, 78, 40, .3); transform: rotate(-4deg); position: relative; text-align: center; font-weight: 800; }
.polaroid .dish-art { width: 100%; background: #FFF0DA; border-radius: 4px; display: block; }
.polaroid .pip.ph-pip { position: absolute; width: 38%; aspect-ratio: 1; inset: auto; right: -6%; top: 26%; animation: none; }
.polaroid p { margin: 8px 0 0; font-size: 16px; }
.photo.in .polaroid { animation: photo-in .7s cubic-bezier(.2, 1.3, .4, 1) both; }

/* ---------- sheet & panels ---------- */
.sheet { position: relative; z-index: 10; flex: none; margin-top: -26px; background: var(--cream); border-radius: 28px 28px 0 0; box-shadow: 0 -6px 26px rgba(122, 78, 40, .16); padding: 16px 18px calc(env(safe-area-inset-bottom) + 18px); max-height: 66%; overflow-y: auto; }
.mode-easy .sheet { max-height: 72%; padding: 18px 18px calc(env(safe-area-inset-bottom) + 20px); }
.panel { display: flex; flex-direction: column; gap: 12px; }
.panel.enter > * { animation: rise .38s cubic-bezier(.2, .9, .3, 1) both; }
.panel.enter > *:nth-child(2) { animation-delay: .04s; } .panel.enter > *:nth-child(3) { animation-delay: .08s; } .panel.enter > *:nth-child(4) { animation-delay: .12s; }
.ptitle { font-family: var(--font-display); font-weight: 600; font-size: 23px; line-height: 1.15; margin: 0; letter-spacing: .005em; display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
.mode-easy .ptitle { font-size: 30px; }
.ptitle:focus { outline: none; }
.ptitle:focus-visible { outline: 3px solid var(--cocoa); }
.psub { margin: -4px 0 0; color: var(--cocoa-2); font-weight: 600; line-height: 1.4; }
.eyebrow { margin: 0 0 -6px; font: 800 12px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--cocoa-2); }
.mode-easy .eyebrow { font-size: 14px; }
.dots { display: inline-flex; gap: 4px; margin-left: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .3; animation: dot 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
.hint { margin: 0; color: var(--cocoa-2); font-size: .85em; font-weight: 600; text-align: center; min-height: 1em; }

/* buttons: soft "pillow" buttons with a pressed state */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 10px 18px; border-radius: 18px; border: 0; font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.15; background: var(--paper); color: var(--cocoa); box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s, background .2s; text-align: center; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--honey-deep); box-shadow: 0 5px 0 var(--honey-edge); }
.btn.primary:active:not(:disabled) { box-shadow: 0 2px 0 var(--honey-edge); }
.btn.soft { background: var(--cream-2); box-shadow: 0 4px 0 var(--line); }
.btn.ghost { background: transparent; box-shadow: none; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; text-decoration-color: rgba(75, 46, 36, .35); min-height: 44px; }
.btn.ghost.sm { min-height: 40px; padding: 6px 10px; font-size: 15px; }
.btn.danger { color: #9A3A22; }
.btn.big { min-height: 60px; font-size: 20px; border-radius: 22px; }
.mode-easy .btn { min-height: 60px; font-size: 21px; }
.mode-easy .btn.big { min-height: 76px; font-size: 25px; border-radius: 24px; }
.btn:disabled { opacity: .55; box-shadow: 0 2px 0 var(--line); }
.btn .bi, .btn .ing.bi { width: 34px; height: 34px; flex: none; }
.mode-easy .btn .bi { width: 42px; height: 42px; }
.btn .dish-art.bi { width: 54px; height: auto; }
.btn .emo { font-size: 1.15em; line-height: 1; }
.btn.serve.ready { animation: ready-glow 1.6s ease-in-out infinite; }
.btn.chip { min-height: 56px; border-radius: 999px; font-size: 21px; padding: 10px 18px; background: var(--paper); }
.col-actions { display: flex; flex-direction: column; gap: 12px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.row-actions .btn { flex: 1 1 auto; }
.mode-easy .row-actions .btn.ghost { flex: 0 1 auto; padding: 8px 10px; font-size: 19px; }

/* choice tiles */
.tiles { display: grid; gap: 12px; }
.tiles.two { grid-template-columns: 1fr 1fr; }
.tiles.three { grid-template-columns: repeat(3, 1fr); }
.tiles.four { grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 6px 10px; min-height: 112px; border: 0; border-radius: 22px; background: var(--paper); box-shadow: 0 5px 0 var(--line), inset 0 0 0 2px #F6E4C8; transition: transform .08s, box-shadow .08s; }
.tile:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line), inset 0 0 0 2px #F6E4C8; }
.tile .ing { width: 64px; height: 64px; }
.tile .tl { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.1; text-align: center; }
.tile .ts { font-size: 12px; font-weight: 700; color: var(--cocoa-2); }
.tiles.four .tile { min-height: 92px; padding: 8px 4px; border-radius: 18px; }
.tiles.four .tile .ing { width: 46px; height: 46px; }
.tiles.four .tile .tl { font-size: 14px; }
.mode-easy .tile { min-height: 150px; }
.mode-easy .tile .ing { width: 82px; height: 82px; }
.mode-easy .tile .tl { font-size: 24px; }
.mode-easy .tile .ts { font-size: 14px; }
.mode-easy .tiles.three .tile .ing { width: 70px; height: 70px; }
.mode-easy .tiles.three .tile .tl { font-size: 21px; }
.mode-easy .tiles.four { grid-template-columns: 1fr 1fr; }

.dish-list { display: flex; flex-direction: column; gap: 10px; }
.dish-card { display: flex; align-items: center; gap: 14px; text-align: left; border: 0; border-radius: 22px; padding: 8px 16px 8px 8px; background: var(--paper); box-shadow: 0 5px 0 var(--line), inset 0 0 0 2px #F6E4C8; min-height: 84px; }
.dish-card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.dish-card .dish-art { width: 104px; flex: none; }
.dish-card b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 24px; }
.dish-card small { display: block; font-weight: 700; color: var(--cocoa-2); font-size: 14px; }
.mode-standard .dish-card b { font-size: 19px; }
.dish-chip { display: flex; align-items: center; gap: 12px; background: var(--paper); border-radius: 18px; padding: 6px 14px 6px 6px; box-shadow: inset 0 0 0 2px #F6E4C8; }
.dish-chip .dish-art { width: 88px; flex: none; }
.dish-chip b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 20px; }
.dish-chip span { display: block; font-weight: 700; color: var(--cocoa-2); }

/* live feed of the other person's actions */
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.feed li { display: flex; align-items: center; gap: 10px; background: var(--paper); border-radius: 16px; padding: 6px 12px 6px 6px; font-weight: 700; min-height: 48px; }
.feed li.wait { color: var(--cocoa-2); background: rgba(255, 253, 248, .6); }
.feed li .fi { width: 36px; height: 36px; flex: none; }
.feed li > span:not(.dots) { flex: 1; }
.feed li b { color: var(--sage-ink); font-size: 1.1em; }
.mode-easy .feed li { min-height: 58px; }
.mode-easy .feed li .fi { width: 44px; height: 44px; }

.stirbar { height: 16px; border-radius: 999px; background: var(--cream-2); overflow: hidden; box-shadow: inset 0 2px 0 rgba(122, 78, 40, .1); }
.stirbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--honey-deep), var(--tomato)); border-radius: 999px; transition: width .1s linear; }

/* step ribbon: whose turn it is */
.ribbon { margin: -2px 0 12px; }
.steps-row { list-style: none; margin: 0; padding: 0; display: flex; justify-content: space-between; position: relative; }
.steps-row::before { content: ""; position: absolute; left: 8%; right: 8%; top: 15px; height: 3px; background: var(--line); border-radius: 3px; }
.steps-row li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; font-size: 11.5px; font-weight: 800; color: var(--cocoa-2); }
.mode-easy .steps-row li { font-size: 14px; }
.steps-row .node { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; font: 700 14px/1 var(--font-display); background: var(--paper); box-shadow: inset 0 0 0 2px var(--line); color: var(--cocoa-2); }
.steps-row .who-grandma.now .node { background: var(--sage); box-shadow: 0 0 0 4px rgba(169, 207, 159, .45); color: var(--cocoa); }
.steps-row .who-steven.now .node { background: var(--blush); box-shadow: 0 0 0 4px rgba(255, 179, 181, .45); color: var(--cocoa); }
.steps-row .now .node { animation: pulse-node 1.6s ease-in-out infinite; }
.steps-row .now { color: var(--cocoa); }
.steps-row .done .node { background: var(--cocoa); color: var(--paper); box-shadow: none; }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; z-index: 50; background: rgba(75, 46, 36, .32); display: flex; align-items: flex-end; justify-content: center; padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px); }
.overlay.enter { animation: fade-in .25s ease both; }
.ov-card, .ov-invite { background: rgba(75, 46, 36, .4); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.overlay.enter .modal { animation: sheet-up .5s cubic-bezier(.2, 1.1, .3, 1) both; }
.modal { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet-modal { background: var(--cream); border-radius: 26px; padding: 16px 18px 20px; box-shadow: 0 -6px 30px rgba(75, 46, 36, .25); }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mhead h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 24px; }
.mhead h2:focus { outline: none; }
.kactions { background: var(--cream); border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -4px 24px rgba(75, 46, 36, .2); }
.ov-card { align-items: center; }

/* keepsake card */
.kcard { position: relative; background: var(--paper); border-radius: 22px; padding: 14px 14px 16px; box-shadow: 0 12px 36px rgba(75, 46, 36, .28); background-image: linear-gradient(transparent 0 0); }
.kcard::before { content: ""; position: absolute; inset: 6px; border-radius: 17px; border: 2px dashed #F2DDBE; pointer-events: none; }
.kphoto { position: relative; background: linear-gradient(#FFF0DA, #FFE6C2); border-radius: 14px; padding: 8px 10px 4px; transform: rotate(-1.4deg); }
.kphoto .dish-art { width: 58%; display: block; margin: 0 auto; }
.kphoto .pip.sticker { position: absolute; inset: auto; right: 2%; bottom: 4%; width: 30%; aspect-ratio: 1; animation: none; transform: rotate(6deg); }
.kphoto .tape { position: absolute; top: -9px; width: 64px; height: 20px; background: rgba(255, 210, 142, .8); border-radius: 3px; }
.kphoto .tape.l { left: 12px; transform: rotate(-8deg); } .kphoto .tape.r { right: 12px; transform: rotate(7deg); background: rgba(255, 179, 181, .8); }
.kphoto .stamp { position: absolute; left: 6%; top: 14%; transform: rotate(-10deg); border: 3px solid #C74A33; color: #A8381F; border-radius: 10px; padding: 3px 8px; font: 700 13px/1.15 var(--font-display); background: rgba(255, 253, 248, .85); max-width: 46%; }
.kbody { padding: 10px 6px 0; position: relative; }
.kbody h2 { margin: 2px 0 2px; font-family: var(--font-display); font-weight: 600; font-size: 25px; line-height: 1.1; }
.kbody h2:focus { outline: none; }
.mode-easy .kbody h2 { font-size: 29px; }
.kmeta { margin: 0 0 8px; color: var(--cocoa-2); font-weight: 700; font-size: 13px; }
.mode-easy .kmeta { font-size: 16px; }
.kcontrib { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.kcontrib li { display: flex; gap: 10px; align-items: flex-start; background: var(--cream); border-radius: 14px; padding: 7px 10px; }
.kcontrib li div { display: flex; flex-direction: column; font-weight: 700; font-size: 14px; line-height: 1.35; }
.mode-easy .kcontrib li div { font-size: 16.5px; }
.kcontrib li b { font-family: var(--font-display); font-weight: 600; }
.kpip { display: flex; gap: 8px; align-items: center; margin: 10px 0 0; font-weight: 700; font-size: 14.5px; line-height: 1.35; }
.mode-easy .kpip { font-size: 17px; }
.kpip .mini-pip { width: 40px; height: 40px; }
.kmsgs { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.msg { display: flex; gap: 8px; align-items: flex-end; animation: pop-in .45s cubic-bezier(.2, 1.4, .4, 1) both; }
.msg p { margin: 0; background: var(--cream-2); padding: 8px 12px; border-radius: 16px 16px 16px 4px; font-weight: 800; font-size: 16px; }
.mode-easy .msg p { font-size: 20px; }
.msg.from-g p { background: #E7F2E3; }
.msg small { font-weight: 700; color: var(--cocoa-2); }
.sent-note { margin: 0; text-align: center; font-weight: 800; color: var(--sage-ink); }
.reply-t { margin: 0; font-weight: 800; text-align: center; }
.reply-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.reply-row .btn { flex: 1 1 30%; white-space: nowrap; }
.mode-easy .reply-row { flex-direction: column; }
.mode-easy .reply-row .btn { flex: none; width: 100%; }

/* invitation letter */
.ov-invite { align-items: center; }
.letter { background: var(--paper); border-radius: 24px; padding: 18px 16px 16px; box-shadow: 0 12px 36px rgba(75, 46, 36, .28); position: relative; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.letter-top { position: relative; width: 150px; height: 104px; }
.letter-top .env { position: absolute; left: 0; bottom: 0; width: 96px; height: 96px; transform: rotate(-8deg); }
.letter-top .pip.letter-pip { position: absolute; inset: auto; right: 0; bottom: 0; width: 86px; height: 86px; }
.letter h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 25px; line-height: 1.15; }
.letter h2:focus { outline: none; }
.letter .dish-chip { width: 100%; text-align: left; }
.letter-quote { display: flex; align-items: center; gap: 8px; margin: 2px 0 0; font-weight: 800; background: #E7F2E3; border-radius: 16px; padding: 8px 12px; }

/* moments */
.mgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.mcard { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border: 0; border-radius: 18px; padding: 8px 10px 10px; background: var(--paper); box-shadow: 0 4px 0 var(--line); }
.mcard .dish-art { width: 100%; background: #FFF0DA; border-radius: 12px; }
.mcard .m-st { position: absolute; right: 6px; top: 38%; width: 38px; height: 38px; }
.mcard b { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.15; margin-top: 4px; }
.mcard small { color: var(--cocoa-2); font-weight: 700; }
.empty { display: flex; align-items: center; gap: 12px; font-weight: 700; color: var(--cocoa-2); background: var(--paper); border-radius: 18px; padding: 14px; margin: 0; }
.empty .mini-pip { width: 56px; height: 56px; }

/* settings */
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; }
.seg { display: inline-flex; background: var(--cream-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 8px 14px; min-height: 44px; font-weight: 800; }
.seg button.on { background: var(--paper); box-shadow: 0 2px 0 var(--line); }
.stv { font-weight: 800; color: var(--cocoa-2); }
.menu-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.about h3 { font-family: var(--font-display); font-weight: 600; font-size: 17px; margin: 10px 0 4px; }
.about ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-weight: 600; line-height: 1.4; font-size: 14.5px; }
.about[lang="zh-CN"] { border-top: 2px dashed var(--line); margin-top: 10px; padding-top: 4px; }

/* fliers (drag ghost, falling ingredients) */
.panel.busy .btn, .panel.busy .tile { opacity: .55; transition: opacity .2s; }
.flyer { position: fixed; z-index: 9999; pointer-events: none; display: block; }
.flyer svg, .flyer .ing { width: 100%; height: 100%; display: block; }
.flyer.drag { filter: drop-shadow(0 10px 8px rgba(75, 46, 36, .25)); }

/* ---------- role picker & side-by-side view ---------- */
.picker { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px 20px calc(env(safe-area-inset-bottom) + 24px); text-align: center; }
.picker .hero-pip { position: relative; width: 150px; height: 150px; }
.picker .hero-pip .pip { animation: breathe 2.8s ease-in-out infinite; }
.picker h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 46px; letter-spacing: .14em; }
.picker .tag { margin: -8px 0 4px; font-weight: 800; color: var(--cocoa-2); }
.picker h2 { margin: 8px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 24px; }
.picker p.sub { margin: 0; max-width: 32ch; font-weight: 700; color: var(--cocoa-2); }
.role-cards { display: grid; gap: 12px; width: 100%; max-width: 380px; }
.role-card { display: flex; align-items: center; gap: 14px; text-align: left; border: 0; border-radius: 22px; padding: 14px 16px; background: var(--paper); box-shadow: 0 5px 0 var(--honey-edge); min-height: 82px; }
.role-card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--honey-edge); }
.role-card .av { width: 52px; height: 52px; font-size: 24px; }
.role-card b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 23px; }
.role-card span.s { font-weight: 700; color: var(--cocoa-2); }
.link-btn { border: 0; background: none; font-weight: 800; text-decoration: underline; text-underline-offset: 4px; padding: 10px; min-height: 44px; }

.split { height: 100%; display: flex; flex-direction: column; align-items: center; background: radial-gradient(120% 80% at 50% 0%, #FFE2B0 0%, var(--honey) 60%); overflow: hidden; }
.split-head { display: flex; align-items: center; gap: 14px; padding: 14px 20px 10px; flex-wrap: wrap; justify-content: center; flex: none; }
.split-head h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 26px; letter-spacing: .1em; display: flex; align-items: center; gap: 8px; }
.split-head h1 .mini-pip { width: 38px; height: 38px; }
.split-head p { margin: 0; font-weight: 800; color: var(--cocoa-2); }
.split-head .btn { min-height: 40px; font-size: 14px; padding: 6px 14px; }
.phones { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: var(--gap, 46px); }
.phone-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.phone-cap { font-weight: 800; display: flex; align-items: center; gap: 8px; background: rgba(255, 253, 248, .75); border-radius: 999px; padding: 4px 12px 4px 4px; }
.phone-holder { width: calc(390px * var(--s, 1)); height: calc(812px * var(--s, 1)); position: relative; }
.phone { position: absolute; left: 0; top: 0; width: 390px; height: 812px; transform: scale(var(--s, 1)); transform-origin: 0 0; border-radius: 52px; background: #3A2A22; padding: 11px; box-shadow: 0 30px 60px rgba(75, 46, 36, .32), inset 0 0 0 2px #5A4236; }
.phone-screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--honey); transform: translateZ(0); }
.phone-screen .app { height: 100%; }
.split-foot { padding: 6px 16px 12px; font-weight: 700; color: var(--cocoa-2); font-size: 13px; text-align: center; max-width: 900px; }

/* ---------- motion ---------- */
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, .97); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.12); } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6%) rotate(3deg); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-9deg) translateY(-4%); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg) translateY(-3%); } 80% { transform: rotate(4deg); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5%) rotate(-4deg); } 40% { transform: translateX(5%) rotate(4deg); } 60% { transform: translateX(-4%); } 80% { transform: translateX(3%); } }
@keyframes chew { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.06, .93); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes pulse-node { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@keyframes dot { 0%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
@keyframes steps { 0%, 100% { opacity: .15; } 40% { opacity: .6; } }
@keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }
@keyframes spin-plain { to { transform: rotate(360deg); } }
@keyframes flicker { 0% { transform: scaleY(1); } 100% { transform: scaleY(.9) translateY(2px); } }
@keyframes fur { 0% { transform: rotate(-2.2deg) scale(1); } 50% { transform: rotate(1deg) scale(1.012); } 100% { transform: rotate(2.4deg) scale(.996); } }
@keyframes flash { 0% { opacity: 0; } 12% { opacity: .95; } 100% { opacity: 0; } }
@keyframes dash-run { to { stroke-dashoffset: -32; } }
@keyframes steam { 0% { opacity: 0; transform: translateY(18px); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-26px); } }
@keyframes bump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(5%) scaleX(1.03); } }
@keyframes plate-in { from { opacity: 0; transform: translateY(40%) scale(.7); } to { opacity: 1; transform: none; } }
@keyframes photo-in { 0% { opacity: 0; transform: translateX(80%) rotate(18deg) scale(.6); } 100% { opacity: 1; transform: rotate(-4deg); } }
@keyframes bubble-in { 0% { opacity: 0; transform: translateX(calc(-30% + var(--bx, 0px))) translateY(10px) scale(.8); } 100% { opacity: 1; transform: translateX(calc(-30% + var(--bx, 0px))) translateY(0) scale(1); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(-14px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-10px); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet-up { from { opacity: 0; transform: translateY(60px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pop-in { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@keyframes twinkle { 0%, 100% { transform: scale(.8) rotate(0); opacity: .7; } 50% { transform: scale(1.1) rotate(30deg); opacity: 1; } }
@keyframes ready-glow { 0%, 100% { box-shadow: 0 5px 0 var(--honey-edge), 0 0 0 0 rgba(233, 101, 79, .0); } 50% { box-shadow: 0 5px 0 var(--honey-edge), 0 0 0 8px rgba(233, 101, 79, .22); } }
/* ---------- turn chip, "watching" chip, tap-to-toss tip ---------- */
.turn-chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; margin: 0 0 -4px; padding: 3px 12px 3px 3px; border-radius: 999px; font: 700 13px/1.1 var(--font-body); }
.turn-chip .av { width: 22px; height: 22px; font-size: 11px; }
.turn-chip.mine { background: var(--honey); color: var(--cocoa); box-shadow: 0 2px 0 var(--honey-edge); animation: chip-glow 1.8s ease-in-out infinite; }
.turn-chip.theirs { background: var(--cream-2); color: var(--cocoa-2); }
.turn-chip .dots { margin-left: 0; }
.mode-easy .turn-chip { font-size: 16px; }
.mode-easy .turn-chip .av { width: 28px; height: 28px; font-size: 14px; }
.watching { position: absolute; z-index: 9; left: 14px; top: calc(env(safe-area-inset-top) + 104px); display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: rgba(255, 253, 248, .95); font-weight: 700; font-size: 13px; box-shadow: 0 2px 0 var(--shadow), 0 6px 16px rgba(122, 78, 40, .12); pointer-events: none; }
.watching.in { animation: pop-in .45s cubic-bezier(.2, 1.4, .4, 1) both; }
.watching .eyes { display: inline-block; animation: look 3.2s ease-in-out infinite; }
.tip { margin: -4px 0 0; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--cocoa-2); font-weight: 700; font-size: 14px; transition: opacity .5s, max-height .5s; max-height: 40px; }
.tip::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--honey-edge); animation: tap-ring 1.4s ease-out infinite; flex: none; }
.tip.used { opacity: 0; max-height: 0; margin: -12px 0 0; }
.mode-easy .tip { font-size: 17px; }

/* ---------- PIP touch: hearts, petting ---------- */
.pip-heart { position: absolute; z-index: 8; left: calc(50% + var(--hx, 0%)); bottom: 62%; width: 15%; aspect-ratio: 1; pointer-events: none; opacity: 0; animation: heart-up 1.45s cubic-bezier(.2, .7, .3, 1) var(--hd, 0s) both; }
.pip-heart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.pip-heart path { fill: #F28B92; stroke: #9C4A45; stroke-width: 1.1; }
.pip.petting { animation: petting .42s ease-in-out infinite alternate; }
.pip-actor { touch-action: none; cursor: pointer; }

/* ---------- selfie ---------- */
.ov-selfie { align-items: center; background: rgba(75, 46, 36, .45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.snapcard { position: relative; background: var(--paper); border-radius: 26px; padding: 18px 16px 18px; box-shadow: 0 14px 40px rgba(75, 46, 36, .3); display: flex; flex-direction: column; gap: 12px; text-align: center; }
.snapcard::before { content: ""; position: absolute; inset: 6px; border-radius: 21px; border: 2px dashed #F2DDBE; pointer-events: none; }
.snapcard > * { position: relative; }
.snapcard h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.15; }
.snapcard h2:focus { outline: none; }
.snapcard .psub { margin: -6px 0 0; }
.mode-easy .snapcard h2 { font-size: 28px; }
.viewfinder { position: relative; width: 100%; max-width: 330px; margin: 2px auto 0; aspect-ratio: 1; border-radius: 24px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #5A4136, #2E211C 75%); box-shadow: 0 0 0 5px #FFF, 0 0 0 7px var(--line), 0 10px 24px rgba(75, 46, 36, .25); isolation: isolate; }
.vf-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0; transition: opacity .45s ease; }
.viewfinder.live .vf-video { opacity: 1; }
.viewfinder.shot .vf-video { display: none; }
.vf-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: shot-in .5s cubic-bezier(.2, 1.2, .4, 1) both; }
.vf-msg { position: absolute; left: 12%; right: 12%; top: 50%; transform: translateY(-50%); margin: 0; color: #FFF3E2; font-weight: 700; font-size: 15px; line-height: 1.4; }
.viewfinder.live .vf-msg, .viewfinder.shot .vf-msg { display: none; }
.viewfinder.nocam { background: repeating-linear-gradient(45deg, #FCEBD2 0 14px, #FFF3E2 14px 28px); }
.viewfinder.nocam .vf-msg { color: var(--cocoa); }
.vf-count { position: absolute; inset: 0; display: grid; place-items: center; font: 600 104px/1 var(--font-display); color: #fff; text-shadow: 0 4px 0 rgba(75, 46, 36, .35), 0 0 30px rgba(75, 46, 36, .4); opacity: 0; pointer-events: none; z-index: 3; }
.vf-count.pop { animation: count-pop .7s cubic-bezier(.2, 1.3, .4, 1) both; }
.vf-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
.vf-flash.go { animation: flash .55s ease-out both; }
.vf-pip { position: absolute; z-index: 2; right: -3%; bottom: -5%; width: 36%; aspect-ratio: 1; pointer-events: none; animation: peek 2.6s ease-in-out infinite; transform-origin: 70% 100%; }
.vf-pip .pip { inset: 0; }
.viewfinder.shot .vf-pip { animation: none; }
.vf-c { position: absolute; z-index: 2; width: 24px; height: 24px; border: 3px solid rgba(255, 255, 255, .85); pointer-events: none; }
.vf-c.tl { left: 12px; top: 12px; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
.vf-c.tr { right: 12px; top: 12px; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
.vf-c.bl { left: 12px; bottom: 12px; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }
.vf-c.br { right: 12px; bottom: 12px; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
.viewfinder.nocam .vf-c { border-color: rgba(75, 46, 36, .35); }
.snapcard:has(.viewfinder.live) .shutter:not(.dim) { animation: ready-glow 1.6s ease-in-out infinite; }
.filebtn { position: relative; cursor: pointer; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.filebtn:focus-within { outline: 3px solid var(--cocoa); outline-offset: 2px; }
.dim { opacity: .45; pointer-events: none; }
.snap-pair { display: flex; justify-content: center; align-items: flex-start; gap: 6px; padding: 12px 4px 6px; }
.mini-pola { position: relative; margin: 0; width: 46%; max-width: 170px; background: #fff; padding: 8px 8px 30px; border-radius: 4px; box-shadow: 0 6px 16px rgba(75, 46, 36, .2), 0 1px 0 rgba(75, 46, 36, .1); }
.mini-pola.l { transform: rotate(-5deg); }
.mini-pola.r { transform: rotate(4deg) translateY(10px); }
.mini-pola img, .mini-pola .ph { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 2px; }
.mini-pola .ph { display: grid; place-items: center; align-content: center; gap: 10px; background: repeating-linear-gradient(-45deg, #FCEBD2 0 10px, #FFF3E2 10px 20px); }
.mini-pola.waiting { animation: wait-bob 2.4s ease-in-out infinite; }
.mini-pola figcaption { position: absolute; left: 0; right: 0; bottom: 6px; font: 600 15px/1 var(--font-display); color: var(--cocoa); }
.mini-pola::before { content: ""; position: absolute; top: -8px; left: 50%; width: 46px; height: 16px; margin-left: -23px; background: rgba(255, 210, 142, .85); border-radius: 2px; transform: rotate(-4deg); }
.mini-pola.r::before { background: rgba(157, 191, 227, .85); transform: rotate(5deg); }
.reveal-frame { position: relative; width: 100%; max-width: 330px; margin: 0 auto; aspect-ratio: 1080 / 1350; max-height: 52vh; border-radius: 14px; overflow: hidden; background: linear-gradient(110deg, #FCEBD2 30%, #FFF6E8 50%, #FCEBD2 70%) 0 0 / 300% 100%; animation: shimmer 1.6s linear infinite; box-shadow: 0 10px 26px rgba(75, 46, 36, .25); }
.reveal-frame.done { animation: none; background: #FFF0DA; }
.group-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; filter: blur(10px) sepia(.6) brightness(1.35) saturate(.4); transform: scale(1.04); transition: opacity 1s ease, filter 2.6s cubic-bezier(.3, 0, .2, 1), transform 1.8s cubic-bezier(.2, .8, .2, 1); }
.group-photo.in { opacity: 1; filter: none; transform: none; }
.developing { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--cocoa-2); font-weight: 700; font-size: 15px; transition: opacity .6s ease; }
.developing .mini-pip { width: 64px; height: 64px; animation: bob 1.6s ease-in-out infinite; }
.reveal-frame.done .developing { opacity: 0; }
.kphoto.has-group { padding: 8px; }
.kgroup { display: block; width: auto; max-width: 100%; max-height: 50vh; margin: 0 auto; border-radius: 10px; box-shadow: 0 4px 12px rgba(75, 46, 36, .18); }
.mthumb { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; object-position: 50% 42%; border-radius: 12px; background: #FFF0DA; }

@keyframes wisp { 0% { opacity: 0; transform: translateY(7px) scaleY(.7); } 35% { opacity: .85; } 100% { opacity: 0; transform: translateY(-15px) scaleY(1.1); } }
@keyframes chip-glow { 0%, 100% { box-shadow: 0 2px 0 var(--honey-edge), 0 0 0 0 rgba(247, 182, 90, 0); } 50% { box-shadow: 0 2px 0 var(--honey-edge), 0 0 0 6px rgba(247, 182, 90, .35); } }
@keyframes look { 0%, 40%, 100% { transform: translateX(0); } 55%, 70% { transform: translateX(3px); } 80%, 90% { transform: translateX(-3px); } }
@keyframes tap-ring { 0% { transform: scale(.6); opacity: 1; } 70% { transform: scale(1.15); opacity: .2; } 100% { transform: scale(1.2); opacity: 0; } }
@keyframes heart-up { 0% { opacity: 0; transform: translate(-50%, 20%) scale(.2); } 18% { opacity: 1; transform: translate(-50%, 0) scale(var(--hs, 1)); } 100% { opacity: 0; transform: translate(calc(-50% + var(--hx, 0%) * .4), -230%) scale(var(--hs, 1)) rotate(12deg); } }
@keyframes petting { 0% { transform: scale(1.03, .96) rotate(-2deg); } 100% { transform: scale(.98, 1.03) rotate(2deg); } }
@keyframes count-pop { 0% { opacity: 0; transform: scale(2.2); } 25% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.8); } }
@keyframes shot-in { from { transform: scale(1.12); filter: brightness(1.8); } to { transform: none; filter: none; } }
@keyframes peek { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6%) rotate(3deg); } }
@keyframes wait-bob { 0%, 100% { transform: rotate(4deg) translateY(10px); } 50% { transform: rotate(2deg) translateY(4px); } }
@keyframes shimmer { to { background-position: -300% 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- web build: kitchen code page ---------- */
.picker.room { justify-content: flex-start; padding-top: 22px; gap: 10px; }
.room-top { display: flex; align-items: center; gap: 8px; font: 600 22px/1 var(--font-display); letter-spacing: .1em; }
.room-top .mini-pip { width: 34px; height: 34px; }

.room-code code, .stv code { font: 800 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
.room-cards { display: grid; gap: 14px; width: 100%; max-width: 760px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.room-card { background: var(--paper); border-radius: 24px; padding: 14px; box-shadow: 0 5px 0 var(--honey-edge); display: flex; flex-direction: column; gap: 10px; align-items: stretch; text-align: left; }

.rc-qr { align-self: center; width: 172px; height: 172px; background: #fff; border-radius: 14px; padding: 6px; box-shadow: inset 0 0 0 2px var(--line); }

<body>
<div id="root"></div>
<script src="vendor/mqtt.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
"use strict";
const PIP_BUILD = "web";
/* ---- art.js ---- */
/* ============================================================
   PIP art: fluffy body (canvas), faces, ingredients, dishes, scenes
   All original drawings. Style: cozy storybook, rounded shapes,
   warm cocoa outlines, honey + cream + blush palette.
   ============================================================ */
const INK = '#5B3A2E';
const O = `stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;

function seeded(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}

/* ---------- PIP body: hand-made fluff on canvas (cached data URL) ----------
   Drawn to match the team's sketch: a soft cream-white puff with a grainy,
   chalky edge, no outline, no legs. */
const Art = {};
Art._fluff = null;
Art.fluff = function () {
  if (Art._fluff) return Art._fluff;
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  if (!x) return '';
  const cx = S / 2, cy = S / 2 + 6, R = 200;
  const rnd = seeded(20261107);
  // soft halo: the puff melts into whatever is behind it
  const halo = x.createRadialGradient(cx, cy, R * 0.82, cx, cy, R * 1.05);
  halo.addColorStop(0, 'rgba(250,244,233,1)');
  halo.addColorStop(0.55, 'rgba(250,244,233,0.55)');
  halo.addColorStop(1, 'rgba(250,244,233,0)');
  x.fillStyle = halo; x.beginPath(); x.arc(cx, cy, R * 1.05, 0, Math.PI * 2); x.fill();
  // body: nearly flat cream, a touch warmer toward the rim
  const g = x.createRadialGradient(cx - 30, cy - 40, 10, cx, cy, R * 0.9);
  g.addColorStop(0, '#FFFEFA');
  g.addColorStop(0.7, '#FDF9F1');
  g.addColorStop(1, '#F9F1E4');
  x.fillStyle = g;
  x.beginPath(); x.arc(cx, cy, R * 0.88, 0, Math.PI * 2); x.fill();
  x.lineCap = 'round';
  // chalky fringe: short soft hairs pointing every which way
  for (let i = 0; i < 7000; i++) {
    const a = rnd() * Math.PI * 2;
    const r0 = R * (0.8 + rnd() * 0.2);
    const len = R * (0.015 + rnd() * rnd() * 0.06);
    const dir = a + (rnd() - 0.5) * 1.8;
    const x0 = cx + Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0;
    const k = rnd();
    x.strokeStyle = k < 0.7 ? `rgba(255,252,245,${0.35 + rnd() * 0.5})` : `rgba(246,236,220,${0.3 + rnd() * 0.4})`;
    x.lineWidth = 0.7 + rnd() * 1.2;
    x.beginPath(); x.moveTo(x0, y0); x.lineTo(x0 + Math.cos(dir) * len, y0 + Math.sin(dir) * len); x.stroke();
  }
  // pastel dust that thins out past the edge
  for (let i = 0; i < 9000; i++) {
    const a = rnd() * Math.PI * 2, u = rnd();
    const r = R * (0.86 + u * 0.24);
    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    x.fillStyle = rnd() < 0.85 ? `rgba(255,251,243,${(1 - u) * (0.4 + rnd() * 0.5)})` : `rgba(232,214,188,${(1 - u) * 0.35})`;
    const d = 0.8 + rnd() * 1.5;
    x.fillRect(px - d / 2, py - d / 2, d, d);
  }
  // faint paper grain inside
  for (let i = 0; i < 1800; i++) {
    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * R * 0.84;
    x.fillStyle = `rgba(236,222,200,${0.05 + rnd() * 0.1})`;
    x.fillRect(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 1.2, 1.2);
  }
  // just a whisper of volume
  x.globalCompositeOperation = 'source-atop';
  const sh = x.createRadialGradient(cx + 20, cy + R * 0.95, R * 0.1, cx, cy + R * 0.3, R * 1.1);
  sh.addColorStop(0, 'rgba(226,200,166,0.22)');
  sh.addColorStop(1, 'rgba(226,200,166,0)');
  x.fillStyle = sh; x.fillRect(0, 0, S, S);
  x.globalCompositeOperation = 'source-over';
  try { Art._fluff = c.toDataURL('image/png'); } catch (e) { Art._fluff = ''; }
  return Art._fluff;
};

/* paper grain overlay (tiny tile) */
Art._grain = null;
Art.grain = function () {
  if (Art._grain !== null) return Art._grain;
  try {
    const S = 160, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'); const img = x.createImageData(S, S); const rnd = seeded(77);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 120 + rnd() * 80;
      img.data[i] = v; img.data[i + 1] = v * 0.9; img.data[i + 2] = v * 0.75; img.data[i + 3] = rnd() < 0.5 ? 10 : 0;
    }
    x.putImageData(img, 0, 0);
    Art._grain = c.toDataURL('image/png');
  } catch (e) { Art._grain = ''; }
  return Art._grain;
};

/* ---------- PIP face (viewBox 200x200, body centre 100,102, radius ~78) ----------
   Tiny upright oval eyes, soft pink cheeks and a bean-shaped smile, as in the sketch. */
const FACE_INK = '#4E3129';
const MOUTH_INK = '#5B3A31';
function eyeOval(cx, cy, s = 1) { return `<ellipse cx="${cx}" cy="${cy}" rx="${2.15 * s}" ry="${5.2 * s}" fill="${FACE_INK}"/>`; }
function arcUp(cx, cy) { return `<path d="M${cx - 5} ${cy + 2} Q${cx} ${cy - 4.6} ${cx + 5} ${cy + 2}" stroke="${FACE_INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`; }
function arcDown(cx, cy) { return `<path d="M${cx - 5} ${cy - 1.5} Q${cx} ${cy + 4} ${cx + 5} ${cy - 1.5}" stroke="${FACE_INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`; }
function heart(cx, cy, s, fill) {
  return `<path transform="translate(${cx} ${cy}) scale(${s})" d="M0 4 C-7 -2 -6 -9 -2.2 -9 C-.6 -9 0 -7.6 0 -6.6 C0 -7.6 .6 -9 2.2 -9 C6 -9 7 -2 0 4Z" fill="${fill}"/>`;
}
const MOUTH_D = `<path d="M88.6 108.6 C95 107.2 105 107.2 111.4 108.6 C110.9 116.4 106 120.4 100 120.4 C94 120.4 89.1 116.4 88.6 108.6Z" fill="${MOUTH_INK}"/>`;
const MOUTH_BIG = `<path d="M86.4 107.4 C95 105.6 105 105.6 113.6 107.4 C113 118.4 107.2 123.4 100 123.4 C92.8 123.4 87 118.4 86.4 107.4Z" fill="${MOUTH_INK}"/><path d="M93.4 119.6 Q100 114.8 106.6 119.6 Q103.6 123 100 123 Q96.4 123 93.4 119.6Z" fill="#EE8E95"/>`;
const SPARK = (x, y, s) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z" fill="#FFD28E"/>`;

Art.face = function (expr) {
  const L = 79, R = 121, Y = 88;
  let eyes = '', mouth = MOUTH_D, cheeks = 'normal', extra = '';
  switch (expr) {
    case 'happy': eyes = arcUp(L, Y) + arcUp(R, Y); break;
    case 'joy': eyes = arcUp(L, Y) + arcUp(R, Y); mouth = MOUTH_BIG; cheeks = 'big'; extra = SPARK(44, 72, 0.9) + SPARK(156, 64, 0.7); break;
    case 'surprised':
      eyes = `<ellipse cx="${L}" cy="${Y}" rx="3.4" ry="4.2" fill="${FACE_INK}"/><ellipse cx="${R}" cy="${Y}" rx="3.4" ry="4.2" fill="${FACE_INK}"/>`;
      mouth = `<ellipse cx="100" cy="114" rx="5" ry="5.8" fill="${MOUTH_INK}"/>`; break;
    case 'yum':
      eyes = arcDown(L, Y) + arcDown(R, Y);
      mouth = `<path d="M90 110 Q100 119 110 110" stroke="${MOUTH_INK}" stroke-width="2.8" fill="none" stroke-linecap="round"/><path d="M104.5 113.6 q5 1 5.4 6.2 q-5 2.4 -7.8 -2.4z" fill="#EE8E95" stroke="${MOUTH_INK}" stroke-width="1.2"/>`;
      cheeks = 'big'; break;
    case 'chew':
      eyes = arcDown(L, Y) + arcDown(R, Y);
      mouth = `<path d="M93 113 q3.5 -3 7 0 q3.5 3 7 0" stroke="${MOUTH_INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
      cheeks = 'puff'; break;
    case 'blehh':
      eyes = `<path d="M${L - 4.5} ${Y - 4.5} L${L + 3.5} ${Y} L${L - 4.5} ${Y + 4.5}" stroke="${FACE_INK}" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M${R + 4.5} ${Y - 4.5} L${R - 3.5} ${Y} L${R + 4.5} ${Y + 4.5}" stroke="${FACE_INK}" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      mouth = `<path d="M88 110 q3 -4 6 0 q3 4 6 0 q3 -4 6 0 q3 4 6 0" stroke="${MOUTH_INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M96 111 q4 0 8 0 q1 10 -4 11 q-5 -1 -4 -11z" fill="#EE8E95" stroke="${MOUTH_INK}" stroke-width="1.3"/>`;
      cheeks = 'green';
      extra = `<path d="M150 62 q6 9 0 13 q-6 -4 0 -13z" fill="#BFE0F2" stroke="#7FA6C9" stroke-width="1.3"/>`;
      break;
    case 'sleepy':
      eyes = `<path d="M${L - 4.5} ${Y + 1} h9 M${R - 4.5} ${Y + 1} h9" stroke="${FACE_INK}" stroke-width="2.6" stroke-linecap="round"/>`;
      mouth = `<ellipse cx="100" cy="114" rx="3.4" ry="2.8" fill="${MOUTH_INK}"/>`;
      extra = `<text x="142" y="66" font-family="Fredoka, sans-serif" font-size="17" font-weight="600" fill="#B08A6A">z</text><text x="154" y="52" font-family="Fredoka, sans-serif" font-size="12" font-weight="600" fill="#C9A78A">z</text>`;
      break;
    case 'curious':
      eyes = `<g transform="translate(1.5 -1.5)">${eyeOval(L, Y, 1.12)}${eyeOval(R, Y, 1.12)}</g>`;
      mouth = `<path d="M94.5 112 Q100 116.6 105.5 112" stroke="${MOUTH_INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`; break;
    case 'love':
      eyes = heart(L, Y + 2, 0.82, '#E9654F') + heart(R, Y + 2, 0.82, '#E9654F'); mouth = MOUTH_BIG; cheeks = 'big'; break;
    case 'wave':
      eyes = arcUp(L, Y) + eyeOval(R, Y); break;
    default:
      eyes = eyeOval(L, Y) + eyeOval(R, Y);
  }
  const ck = cheeks === 'green' ? '#BFE3B4' : '#F7A9AE';
  const crx = cheeks === 'big' ? 9.4 : cheeks === 'puff' ? 11 : 8;
  const cry = cheeks === 'big' ? 7 : cheeks === 'puff' ? 8.2 : 6.2;
  return `<svg class="pip-face" viewBox="0 0 200 200" aria-hidden="true"><g class="pip-gaze">` +
    `<ellipse class="ck" cx="66" cy="104" rx="${crx}" ry="${cry}" fill="${ck}" opacity=".88" filter="url(#pipSoft)"/>` +
    `<ellipse class="ck" cx="134" cy="104" rx="${crx}" ry="${cry}" fill="${ck}" opacity=".88" filter="url(#pipSoft)"/>` +
    `<g class="pip-eyes">${eyes}</g>${mouth}${extra}</g></svg>`;
};

/* global <defs> used by every PIP face and scene */
Art.defs = `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <filter id="pipSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="hand" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
  <linearGradient id="skyWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE8F4"/><stop offset=".7" stop-color="#FDEBC8"/><stop offset="1" stop-color="#FFE0B0"/></linearGradient>
  <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FB8E0"/><stop offset=".55" stop-color="#F6C3B4"/><stop offset="1" stop-color="#FFD9A6"/></linearGradient>
  <linearGradient id="wokGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E5552"/><stop offset="1" stop-color="#3E3633"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#F7DDB8"/><circle cx="19" cy="19" r="2.2" fill="#F7DDB8"/></pattern>
  <pattern id="tiles" width="22" height="22" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="20" height="20" rx="5" fill="#E5F0DF"/></pattern>
  <clipPath id="wokMouth"><path d="M8 27 Q70 39 132 27 L132 4 L8 4Z"/></clipPath>
</defs></svg>`;

/* ---------- Ingredients (viewBox 0 0 64 64) ---------- */
function starPts(cx, cy, R, r, n) {
  const p = [];
  for (let k = 0; k < n * 2; k++) {
    const a = -Math.PI / 2 + k * Math.PI / n, rr = k % 2 ? r : R;
    p.push((cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1));
  }
  return p.join(' ');
}

/* ---- scenes.js ---- */
/* ============================================================
   Scenes: Grandma's and Steven's kitchens and living rooms.
   Cozy hand-drawn style: warm ink outlines, flat fills, wood grain,
   lots of small props and plants. viewBox 0 0 390 420, counter top y=292.
   ============================================================ */
const K = '#3A2A24';
const ko = (w = 2.4) => `stroke="${K}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const KO = ko();
const SC = {
  wall: '#FFF0DA', woodL: '#E6BA84', woodM: '#D6A066', woodD: '#BC8148', grain: '#C48E57',
  cream: '#FBF4E8', creamS: '#EFE4D2', steel: '#E7E9E9', steelS: '#C8CDCF', glass: '#4C4644',
  leaf: '#7DB765', leafD: '#5C9A4E', leafL: '#A6D488', vein: '#4C8140',
  terra: '#D9875B', terraS: '#BD6C43', teal: '#73B2A6', tealS: '#5A968B', char: '#58524F'
};
let wrnd = seeded(4242);
const r1 = (a, b) => a + wrnd() * (b - a);

/* ---------- little building blocks ---------- */
function woodGrain(x, y, w, h, n = 3, col = SC.grain) {
  let d = '';
  for (let i = 0; i < n; i++) {
    const yy = y + h * (i + 0.5) / n + r1(-1.5, 1.5), x0 = x + r1(4, w * 0.3), x1 = x0 + r1(w * 0.25, w * 0.55);
    d += `M${x0.toFixed(1)} ${yy.toFixed(1)} q${((x1 - x0) / 2).toFixed(1)} ${r1(-2.5, 2.5).toFixed(1)} ${(x1 - x0).toFixed(1)} 0 `;
  }
  return `<path d="${d}" stroke="${col}" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".8"/>`;
}
function leafShape(x, y, len, wid, ang, fill = SC.leaf, vein = true) {
  // a pointed leaf from (x,y) along angle ang (degrees)
  const l = len, w = wid;
  return `<g transform="translate(${x} ${y}) rotate(${ang})"><path d="M0 0 C${l * 0.3} ${-w} ${l * 0.75} ${-w * 0.9} ${l} 0 C${l * 0.75} ${w * 0.9} ${l * 0.3} ${w} 0 0Z" fill="${fill}" ${ko(1.8)}/>` +
    (vein ? `<path d="M${l * 0.08} 0 Q${l * 0.5} ${-w * 0.08} ${l * 0.86} 0" stroke="${SC.vein}" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".75"/>` : '') + `</g>`;
}
function pot(x, y, w, h, fill = SC.terra, shade = SC.terraS, band) {
  // a flowerpot whose rim top-left is (x, y)
  const inset = w * 0.12;
  return `<path d="M${x + inset * 0.3} ${y + h * 0.2} L${x + inset} ${y + h} H${x + w - inset} L${x + w - inset * 0.3} ${y + h * 0.2}Z" fill="${fill}" ${KO}/>` +
    `<path d="M${x + w * 0.62} ${y + h * 0.24} L${x + w - inset * 1.1} ${y + h - 1.5}" stroke="${shade}" stroke-width="${w * 0.12}" stroke-linecap="round" opacity=".7"/>` +
    (band ? `<path d="M${x + inset * 0.5} ${y + h * 0.48} H${x + w - inset * 0.5}" stroke="${band}" stroke-width="3" />` : '') +
    `<rect x="${x - 2}" y="${y}" width="${w + 4}" height="${h * 0.22}" rx="2.5" fill="${fill}" ${KO}/>`;
}
function grassTuft(x, y, s = 1, fill = '#8CC46E') {
  return `<path transform="translate(${x} ${y}) scale(${s})" d="M-8 0 Q-9 -8 -12 -13 Q-6 -9 -4 -3 Q-4 -12 0 -18 Q2 -10 1 -3 Q4 -11 10 -14 Q6 -7 7 0Z" fill="${fill}" ${ko(1.5 / s)}/>`;
}
function bush(x, y, w, h, fill = '#86BE6A') {
  return `<path d="M${x} ${y} q${w * 0.05} ${-h * 0.7} ${w * 0.25} ${-h * 0.75} q${w * 0.08} ${-h * 0.3} ${w * 0.25} ${-h * 0.2} q${w * 0.15} ${-h * 0.25} ${w * 0.27} ${h * 0.05} q${w * 0.2} ${h * 0.05} ${w * 0.23} ${h * 0.9}Z" fill="${fill}" ${ko(1.8)}/>`;
}
function book(x, y, w, h, fill, tilt = 0) {
  return `<g transform="rotate(${tilt} ${x + w / 2} ${y + h})"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.6" fill="${fill}" ${ko(2)}/><path d="M${x + 2} ${y + 6} h${w - 4} M${x + 2} ${y + h - 7} h${w - 4}" stroke="#FFF6E6" stroke-width="1.6" opacity=".8"/></g>`;
}
function jar(x, y, w, h, lid = SC.woodM, fill = '#FFFDF8', content) {
  return `<rect x="${x}" y="${y + 5}" width="${w}" height="${h - 5}" rx="${Math.min(6, w / 3)}" fill="${fill}" ${ko(2)}/>` +
    (content ? `<rect x="${x + 2.5}" y="${y + h * 0.45}" width="${w - 5}" height="${h * 0.5}" rx="${Math.min(4, w / 4)}" fill="${content}" opacity=".9"/>` : '') +
    `<rect x="${x - 1.5}" y="${y}" width="${w + 3}" height="7" rx="3" fill="${lid}" ${ko(2)}/>` +
    `<path d="M${x + 3.5} ${y + 11} v${h * 0.3}" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>`;
}
function barHandle(x, y, w) {
  return `<g ${ko(2)}><path d="M${x} ${y} v-4 M${x + w} ${y} v-4" fill="none"/><rect x="${x - 3}" y="${y - 8}" width="${w + 6}" height="5" rx="2.5" fill="${SC.steel}"/></g>`;
}
// Steam is animated, so it is collected here and drawn in its own light SVG layer on top of the
// static (filtered, hand-drawn) scene. Animating anything inside the filtered group would force the
// wobble filter to re-run every frame, which is slow on phones.
let steamBuf = [];
function steamWisps(x, y, cls = 'scene-steam') {
  const sc = /small/.test(cls) ? ' scale(.6)' : '';
  steamBuf.push(`<g class="${cls}" transform="translate(${x} ${y})${sc}" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path class="w1" d="M-10 0c-6-8 6-12 0-21s4-12 1-19"/><path class="w2" d="M2 -2c-6-8 6-12 0-21s4-12 1-19"/><path class="w3" d="M14 0c-6-8 6-12 0-21s4-12 1-19"/></g>`);
  return '';
}
function scenePack(main) {
  const fx = steamBuf.join(''); steamBuf = [];
  return `<div class="scene-pack">${main}${fx ? `<svg class="scene scene-fx" viewBox="0 0 390 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${fx}</svg>` : ''}</div>`;
}

/* ---------- window views ---------- */
function viewCourtyard() {
  let tufts = '';
  for (let i = 0; i < 9; i++) tufts += grassTuft(14 + i * 13 + r1(-3, 3), 112 + r1(-1, 2), r1(0.45, 0.7), i % 2 ? '#8CC46E' : '#7DB765');
  const fruit = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#F28C3A" ${ko(1.5)}/><path d="M${x - 2.5} ${y - r + 1} l2.5 -2 2.5 2" fill="#6FA35A" ${ko(1.1)}/><circle cx="${x - r * 0.35}" cy="${y - r * 0.3}" r="${r * 0.22}" fill="#FFD3A3"/>`;
  return `<rect x="9" y="9" width="114" height="106" fill="url(#skyWarm)"/>` +
    `<circle cx="98" cy="30" r="10" fill="#FFE7AE"/><path d="M26 30c0-5 8-7 11-2 3-4 11-3 11 2z" fill="#fff" opacity=".9"/>` +
    // far hills and the courtyard wall with roof tiles

/* ---- sync.js ---- */
/* ============================================================
   Shared state + sync.
   Each phone writes ONLY its own role document (single writer,
   no conflicts). Both phones read both documents and derive the
   same cooking phase from them.
     cloud: Claude artifact `db` (persistent, realtime) + `room`
            (instant moments, presence for live stirring)
     local: one screen / same device (in-memory + BroadcastChannel)
   ============================================================ */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));

const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };

const ROLES = ['grandma', 'steven'];
const otherRole = r => (r === 'grandma' ? 'steven' : 'grandma');
const STALE_MS = 3 * 60 * 60 * 1000;

function withTimeout(p, ms, fallback) {
  return Promise.race([Promise.resolve(p).catch(() => fallback), sleep(ms).then(() => fallback)]);
}

class BaseHub {
  constructor() { this.subs = new Set(); this.docs = { grandma: null, steven: null }; this.moments = []; this.photos = { grandma: null, steven: null }; this._q = false; }
  subscribe(fn) { this.subs.add(fn); return () => this.subs.delete(fn); }
  notify() {
    if (this._q) return; this._q = true;
    queueMicrotask(() => { this._q = false; this.subs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); });
  }
  accept(role, doc) {
    if (!ROLES.includes(role) || !validDoc(doc)) return false;
    const cur = this.docs[role];
    if (cur && (cur.v || 0) >= doc.v) return false;
    this.docs[role] = doc; this.notify(); return true;
  }
  sortMoments() { this.moments.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); }
  // selfies: one per role, for the latest cooked dish
  dropPhoto(role) { }
  acceptPhoto(role, rec) {
    if (!ROLES.includes(role)) return false;
    if (!rec) { if (this.photos[role]) { this.photos[role] = null; this.notify(); } return true; }
    if (typeof rec !== 'object' || typeof rec.at !== 'number') return false;
    const cur = this.photos[role];
    if (cur && cur.at >= rec.at) return false;
    this.photos[role] = rec; this.notify(); return true;
  }
}

/* ---------- Local hub: both phones on one screen, or two tabs on one device ---------- */
class LocalHub extends BaseHub {
  constructor(ns, opts = {}) {
    super();
    this.kind = 'local'; this.mode = opts.mode || 'same-screen'; this.ready = true; this.status = this.mode === 'same-screen' ? 'local' : 'tabs';
    this.key = 'pip-local-v1-' + ns;
    const saved = lsGet(this.key, null);
    if (saved && saved.docs) { this.docs = { grandma: saved.docs.grandma || null, steven: saved.docs.steven || null }; this.moments = saved.moments || []; }
    for (const r of ROLES) { const ph = lsGet(this.key + '-photo-' + r, null); if (ph) this.photos[r] = ph; }
    this.pres = {}; this.hosted = new Set(); this.remoteBeat = {}; this.self = uid('t');
    try { this.bc = new BroadcastChannel(this.key); this.bc.onmessage = e => this.onMsg(e.data); } catch (e) { this.bc = null; }
    this.beatTimer = setInterval(() => this.beat(), 2000);
  }
  host(role) { this.hosted.add(role); this.beat(); this.notify(); }
  post(m) { if (this.bc) try { this.bc.postMessage(Object.assign({ from: this.self }, m)); } catch (e) { } }
  persist() { lsSet(this.key, { docs: this.docs, moments: this.moments.slice(0, 40) }); }
  beat() { this.post({ type: 'beat', roles: [...this.hosted], pres: this.pres }); }
  onMsg(m) {
    if (!m || m.from === this.self) return;
    if (m.type === 'doc') { if (this.accept(m.role, m.doc)) this.persist(); }
    else if (m.type === 'beat') {
      (m.roles || []).forEach(r => { this.remoteBeat[r] = Date.now(); });
      if (m.pres) for (const r of ROLES) if (m.pres[r] && !this.hosted.has(r)) this.pres[r] = m.pres[r];
      this.notify();
    } else if (m.type === 'pres') { if (!this.hosted.has(m.role)) { this.pres[m.role] = m.p; this.notify(); } }
    else if (m.type === 'moment') { this.upsertMoment(m.data, false); }
    else if (m.type === 'clear') { this.moments = []; this.photos = { grandma: null, steven: null }; this.persist(); this.notify(); }
    else if (m.type === 'photo') { this.acceptPhoto(m.role, m.rec); }
    else if (m.type === 'hello') { this.beat(); for (const r of this.hosted) { if (this.docs[r]) this.post({ type: 'doc', role: r, doc: this.docs[r] }); if (this.photos[r]) this.post({ type: 'photo', role: r, rec: this.photos[r] }); } }
  }
  write(role, doc) { this.docs[role] = doc; this.persist(); this.post({ type: 'doc', role, doc }); this.notify(); }
  setPresence(role, p) { this.pres[role] = Object.assign({}, this.pres[role], p, { role }); this.post({ type: 'pres', role, p: this.pres[role] }); this.notify(); }
  peerPresence(role) { return this.pres[role] || null; }
  online(role) { return this.hosted.has(role) || (Date.now() - (this.remoteBeat[role] || 0) < 6000); }
  dupRole() { return false; }
  upsertMoment(data, broadcast = true) {
    if (!data || !data.id) return;
    const i = this.moments.findIndex(m => m.id === data.id);
    if (i >= 0) this.moments[i] = data; else this.moments.push(data);
    this.sortMoments(); this.persist(); if (broadcast) this.post({ type: 'moment', data }); this.notify();
  }
  saveMoment(id, data) { this.upsertMoment(Object.assign({}, data, { id })); }
  clearMoments() {
    this.moments = []; this.photos = { grandma: null, steven: null };
    for (const r of ROLES) { try { localStorage.removeItem(this.key + '-photo-' + r); } catch (e) { } }
    this.persist(); this.post({ type: 'clear' }); this.notify();
  }
  savePhoto(role, rec) { this.photos[role] = rec; lsSet(this.key + '-photo-' + role, rec); this.post({ type: 'photo', role, rec }); this.notify(); }
  dropPhoto(role) { if (!this.photos[role]) return; this.photos[role] = null; try { localStorage.removeItem(this.key + '-photo-' + role); } catch (e) { } this.post({ type: 'photo', role, rec: null }); this.notify(); }
  start() { this.post({ type: 'hello' }); return Promise.resolve(true); }
}

/* ---------- Cloud hub: Claude artifact db + room ---------- */
class CloudHub extends BaseHub {
  constructor(ns) {
    super();
    this.kind = 'cloud'; this.ns = ns; this.base = 'pip/' + ns; this.status = 'connecting'; this.ready = false;
    this.loaded = { grandma: false, steven: false }; this.writing = {}; this.dirty = {}; this.peers = []; this.myRole = null;
    this.canWrite = true; this.momentWrites = {};
  }
  async start() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return false;
    const [db, room, user] = await Promise.all([
      withTimeout(c.use('db'), 11000, null), withTimeout(c.use('room'), 11000, null), withTimeout(c.use('user'), 11000, null)
    ]);
    this.db = db; this.room = room; this.user = user;
    if (!db && !room) { this.status = 'offline'; this.notify(); return false; }
    if (user && typeof user.can === 'function') {
      try { const can = await withTimeout(user.can('data.write'), 4000, null); if (can === false) this.canWrite = false; } catch (e) { }
    }
    if (db) this.subscribeDb(); else { this.loaded = { grandma: true, steven: true }; }
    if (room) await this.joinRoom();
    // never block the demo for long: after 4 s go ahead with what we have
    setTimeout(() => { if (!this.ready) { this.ready = true; this.notify(); } }, 4000);
    this.status = this.canWrite ? 'live' : 'view';
    this.checkReady(); this.notify();
    return true;
  }
  subscribeDb() {
    for (const r of ROLES) {
      try {
        this.db.doc(`${this.base}/roles/${r}`).onSnapshot(snap => {
          const d = snap.exists ? snap.data() : null;
          if (d) this.accept(r, clone(d));
          if (!snap.metadata || !snap.metadata.fromCache) { this.loaded[r] = true; this.checkReady(); }
        }, err => { this.loaded[r] = true; this.checkReady(); if (err && err.code === 'revoked') { this.status = 'offline'; this.notify(); } });
      } catch (e) { this.loaded[r] = true; }
    }
    for (const r of ROLES) {
      try { this.db.doc(`${this.base}/photos/${r}`).onSnapshot(snap => { this.acceptPhoto(r, snap.exists ? clone(snap.data()) : null); }, () => { }); } catch (e) { }
    }
    try {
      this.db.collection(`${this.base}/moments`).orderBy('createdAt', 'desc').limit(40).onSnapshot(qs => {
        this.moments = qs.docs.map(d => Object.assign({}, clone(d.data()), { id: d.id }));
        this.notify();
      }, () => { });
    } catch (e) { }
  }
  checkReady() { if (!this.ready && this.loaded.grandma && this.loaded.steven) { this.ready = true; this.notify(); } }
  async joinRoom() {
    let ch = null;
    try { ch = await withTimeout(this.room.join('pip-' + this.ns), 6000, null); } catch (e) { ch = null; }
    this.chan = ch || this.room;
    const onErr = () => { };
    this.chan.on('doc', msg => {
      if (!msg || msg.sameTab || !msg.data) return;
      const { role, doc } = msg.data;
      this.accept(role, doc);
    }, onErr);
    this.chan.on('moment', msg => {
      if (!msg || msg.sameTab || !msg.data || !msg.data.id) return;
      const i = this.moments.findIndex(m => m.id === msg.data.id);
      if (i >= 0) this.moments[i] = msg.data; else this.moments.push(msg.data);
      this.sortMoments(); this.notify();
    }, onErr);
    this.chan.onPeers(ch => {
      this.peers = (ch && ch.peers) ? ch.peers.slice() : [];
      if (ch && ch.joined && ch.joined.some(p => !p.sameTab)) this.rebroadcast();
      this.notify();
    }, onErr);

  }
  setMyRole(role) { this.myRole = role; if (this.chan) this.chan.presence({ role }).catch(() => { }); }
  rebroadcast() { const r = this.myRole; if (r && this.docs[r] && this.chan) this.chan.emit('doc', { role: r, doc: this.docs[r] }).catch(() => { }); }
  write(role, doc) {
    this.docs[role] = doc; this.notify();
    if (this.chan) this.chan.emit('doc', { role, doc }).catch(() => { });
    if (this.db) this.flush(`${this.base}/roles/${role}`, () => this.docs[role]);
  }

        this.dirty[path] = false;

  }

  dupRole(role) { return this.peerList(role).length > 0; }
